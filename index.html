<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E8F5FF">
<title>직조(織造)</title>
<script>
(function(){try{var t=localStorage.getItem('jikjo-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<style>
  :root{
    color-scheme:light;
    --bg:#E8F5FF;
    --card:#FFFFFF;
    --text:#1A2A1A;
    --muted:#4A6A4A;
    --primary:#3F8F3F;
    --primary-text:#3F8F3F;
    --primary-tint:rgba(63,143,63,0.094);
    --primary-tint2:rgba(63,143,63,0.16);
    --danger:#E05252;
    --danger-text:#E05252;
    --danger-tint:rgba(224,82,82,0.094);
    --gray:#F3F4F6;
    --gray-seg:#D9DEE3;
    --gray-text:#6B7280;
    --border:#E7EEF5;
    --blue:#4A90D9;
    --blue-text:#4A90D9;
    --blue-tint:#DCEEFF;
    --auto-text:#2F6FB0;
    --input-bg:#EAF3FF;
    --placeholder:#9DBBD8;
    --warn-bg:#FDF3D8;
    --warn-text:#8A6D2B;
    --tag-warn-text:#B8892B;
    --avatar-bg:#DCEFC0;
    --icon-ink:#5A5A5A;
    --nav-bg:#FFFFFF;
    --dot:#DCE3E8;
    --dot2:#E4E9ED;
    --likert-ink:#B8C4CC;
    --shadow:0 1px 2px rgba(0,0,0,0.03);
    --shadow-lg:0 4px 10px rgba(63,143,63,0.4);
    --overlay:rgba(20,30,40,0.35);

    --c-food:#A8D5A2;
    --c-cafe:#C9B8E8;
    --c-shopping:#F7C9A0;
    --c-game:#A8C8F0;
    --c-beauty:#F5B8D4;
    --c-transport:#B8CCD8;
    --c-snack:#F9DFA0;
    --c-etc:#D9D9DE;

    --p-aura:#B48CC9;
    --p-joy:#D97B4F;
    --p-hyunjae:#D9A544;
    --p-melon:#5A9A5A;
    --p-jay:#4A78C9;

    --ease:cubic-bezier(.2,.8,.2,1);
    --spring:cubic-bezier(.34,1.56,.64,1);

    --glass-bg:rgba(255,255,255,0.58);
    --glass-sheen:rgba(255,255,255,0.55);
    --glass-edge:rgba(255,255,255,0.9);
    --glass-shadow:0 10px 30px rgba(40,80,120,0.14), inset 0 1px 1px rgba(255,255,255,0.9), inset 0 -1px 1px rgba(0,0,0,0.04);
    --glass-light:rgba(255,255,255,0.5);
    --pill-solid:#FFFFFF;
    --pill-shadow:0 2px 10px rgba(40,80,120,0.16);
    --pill-edge:rgba(255,255,255,0.9);
    --pill-drag-shadow:0 6px 16px rgba(40,80,120,0.18);

    --nav-glass-bg:rgba(255,255,255,0.14);
    --nav-glass-edge:rgba(255,255,255,0.8);
    --nav-glass-shadow:0 6px 20px rgba(40,80,120,0.10), inset 0 1px 1px rgba(255,255,255,0.8), inset 0 -1px 1px rgba(0,0,0,0.03);
    --nav-pill-bg:rgba(255,255,255,0.4);
    --nav-pill-shadow:0 2px 8px rgba(40,80,120,0.10), inset 0 1px 1px rgba(255,255,255,0.9);
    --nav-label-halo:rgba(255,255,255,0.85);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#0E1620; --card:#17212B; --text:#E4ECE4; --muted:#9BB39E;
      --primary-text:#6DBE6D; --primary-tint:rgba(95,176,95,0.14); --primary-tint2:rgba(95,176,95,0.24);
      --danger-text:#F07A7A; --danger-tint:rgba(224,82,82,0.16);
      --gray:#212D38; --gray-seg:#3A4754; --gray-text:#A3ADB8; --border:#26333F;
      --blue-text:#7DB3EC; --blue-tint:#1F3347; --auto-text:#8DBCEB;
      --input-bg:#1D2935; --placeholder:#62809C;
      --warn-bg:#342C1B; --warn-text:#E2C47E; --tag-warn-text:#E2B458;
      --avatar-bg:#2B3A22; --icon-ink:#DDE5DD; --nav-bg:#141D26;
      --dot:#33404C; --dot2:#2C3844; --likert-ink:#5E6B77;
      --shadow:0 1px 2px rgba(0,0,0,0.3); --shadow-lg:0 6px 16px rgba(0,0,0,0.45);
      --overlay:rgba(0,0,0,0.55);
    --glass-bg:rgba(255,255,255,0.06); --glass-sheen:rgba(255,255,255,0.08); --glass-edge:rgba(255,255,255,0.12);
    --glass-shadow:0 10px 30px rgba(0,0,0,0.45), inset 0 1px 1px rgba(255,255,255,0.1), inset 0 -1px 1px rgba(0,0,0,0.1);
    --glass-light:rgba(255,255,255,0.15);
    --pill-solid:rgba(255,255,255,0.14); --pill-shadow:none; --pill-edge:rgba(255,255,255,0.3);
    --pill-drag-shadow:0 6px 16px rgba(0,0,0,0.35);
    --nav-glass-bg:rgba(255,255,255,0.04); --nav-glass-edge:rgba(255,255,255,0.14);
    --nav-glass-shadow:0 8px 24px rgba(0,0,0,0.35), inset 0 1px 1px rgba(255,255,255,0.1), inset 0 -1px 1px rgba(0,0,0,0.1);
    --nav-pill-bg:rgba(255,255,255,0.1); --nav-pill-shadow:inset 0 1px 1px rgba(255,255,255,0.15);
    --nav-label-halo:rgba(14,22,32,0.85);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0E1620; --card:#17212B; --text:#E4ECE4; --muted:#9BB39E;
    --primary-text:#6DBE6D; --primary-tint:rgba(95,176,95,0.14); --primary-tint2:rgba(95,176,95,0.24);
    --danger-text:#F07A7A; --danger-tint:rgba(224,82,82,0.16);
    --gray:#212D38; --gray-seg:#3A4754; --gray-text:#A3ADB8; --border:#26333F;
    --blue-text:#7DB3EC; --blue-tint:#1F3347; --auto-text:#8DBCEB;
    --input-bg:#1D2935; --placeholder:#62809C;
    --warn-bg:#342C1B; --warn-text:#E2C47E; --tag-warn-text:#E2B458;
    --avatar-bg:#2B3A22; --icon-ink:#DDE5DD; --nav-bg:#141D26;
    --dot:#33404C; --dot2:#2C3844; --likert-ink:#5E6B77;
    --shadow:0 1px 2px rgba(0,0,0,0.3); --shadow-lg:0 6px 16px rgba(0,0,0,0.45);
    --overlay:rgba(0,0,0,0.55);
    --glass-bg:rgba(255,255,255,0.06); --glass-sheen:rgba(255,255,255,0.08); --glass-edge:rgba(255,255,255,0.12);
    --glass-shadow:0 10px 30px rgba(0,0,0,0.45), inset 0 1px 1px rgba(255,255,255,0.1), inset 0 -1px 1px rgba(0,0,0,0.1);
    --glass-light:rgba(255,255,255,0.15);
    --pill-solid:rgba(255,255,255,0.14); --pill-shadow:none; --pill-edge:rgba(255,255,255,0.3);
    --pill-drag-shadow:0 6px 16px rgba(0,0,0,0.35);
    --nav-glass-bg:rgba(255,255,255,0.04); --nav-glass-edge:rgba(255,255,255,0.14);
    --nav-glass-shadow:0 8px 24px rgba(0,0,0,0.35), inset 0 1px 1px rgba(255,255,255,0.1), inset 0 -1px 1px rgba(0,0,0,0.1);
    --nav-pill-bg:rgba(255,255,255,0.1); --nav-pill-shadow:inset 0 1px 1px rgba(255,255,255,0.15);
    --nav-label-halo:rgba(14,22,32,0.85);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:ui-sans-serif, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    -webkit-tap-highlight-color:transparent;
    transition:background-color .3s ease, color .3s ease;
  }
  #root{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(100px + env(safe-area-inset-bottom));transition:padding .3s ease;}
  #root.no-nav{padding-bottom:0;}
  button{font-family:inherit;cursor:pointer;color:inherit;}
  button, .card, .txn-card, .chip, .pill, .mood-btn, .cat-btn, .bank-tile, .method, .likert-btn, .text-input{
    transition:background-color .2s ease, border-color .2s ease, color .2s ease, transform .15s ease, opacity .2s ease, box-shadow .2s ease;
  }
  button:active:not(:disabled){transform:scale(.97);}
  button:disabled{cursor:default;}
  :focus-visible{outline:2px solid var(--primary-text);outline-offset:2px;}

  /* screen transitions */
  @keyframes screenFade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  @keyframes screenPush{from{opacity:0;transform:translateX(36px);}to{opacity:1;transform:none;}}
  @keyframes screenPop{from{opacity:0;transform:translateX(-36px);}to{opacity:1;transform:none;}}
  .screen-fade{animation:screenFade .32s var(--ease) both;}
  .screen-push{animation:screenPush .34s var(--ease) both;}
  .screen-pop{animation:screenPop .34s var(--ease) both;}
  @keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.98);}to{opacity:1;transform:none;}}
  .pop-in{animation:popIn .35s var(--ease) both;}
  @keyframes growY{from{transform:scaleY(0);}to{transform:scaleY(1);}}
  @keyframes growX{from{transform:scaleX(0);}to{transform:scaleX(1);}}
  @keyframes spinIn{from{opacity:0;transform:rotate(-90deg) scale(.85);}to{opacity:1;transform:none;}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes fadeOut{from{opacity:1;}to{opacity:0;}}
  @keyframes sheetUp{from{transform:translateY(100%);}to{transform:none;}}
  @keyframes sheetDown{from{transform:none;}to{transform:translateY(100%);}}
  @keyframes slideR{from{opacity:0;transform:translateX(28px);}to{opacity:1;transform:none;}}
  @keyframes slideL{from{opacity:0;transform:translateX(-28px);}to{opacity:1;transform:none;}}
  @keyframes shake{10%,90%{transform:translateX(-2px);}20%,80%{transform:translateX(4px);}30%,50%,70%{transform:translateX(-6px);}40%,60%{transform:translateX(6px);}}
  @keyframes shimmer{from{background-position:200% 0;}to{background-position:-200% 0;}}
  @keyframes scan{from{top:4%;}to{top:92%;}}
  @keyframes popBig{0%{transform:scale(.4);opacity:0;}100%{transform:scale(1);opacity:1;}}
  @keyframes draw{from{stroke-dashoffset:30;}to{stroke-dashoffset:0;}}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  .from-right{animation:slideR .32s var(--ease) both;}
  .from-left{animation:slideL .32s var(--ease) both;}

  .header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 20px 4px;}
  .brand{font-size:20px;font-weight:800;margin:0 0 4px;}
  .brand-sm{font-size:13px;font-weight:700;color:var(--muted);margin:0;}
  .tagline{font-size:13px;color:var(--muted);margin:0;}
  .page-title{font-size:22px;font-weight:800;margin:2px 0 0;}
  .icon-btn{flex-shrink:0;width:40px;height:40px;border-radius:50%;border:none;background:var(--card);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow);}
  .icon-btn.ghost{background:transparent;box-shadow:none;color:var(--text);width:44px;height:44px;}
  .back-link{display:flex;align-items:center;gap:4px;color:var(--primary-text);font-size:14px;font-weight:600;padding:8px 20px 0;cursor:pointer;width:fit-content;background:none;border:none;}

  .card{background:var(--card);border-radius:16px;margin:14px 16px;padding:18px;box-shadow:var(--shadow);}
  .card-btn{display:flex;align-items:center;gap:14px;width:calc(100% - 32px);text-align:left;border:none;font:inherit;color:inherit;}
  .card-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .card-title{font-size:14px;color:var(--muted);font-weight:600;margin:0;}
  .sec-title{font-size:16px;color:var(--text);font-weight:800;margin:0;}
  .muted-sm{font-size:12.5px;color:var(--muted);margin:0;}
  .link-btn{background:none;border:none;color:var(--primary-text);font-size:12px;font-weight:600;display:flex;align-items:center;gap:2px;padding:0;}
  .text-btn{background:none;border:none;color:var(--primary-text);font-size:13.5px;font-weight:700;padding:10px 0 0;}
  .big-amount{font-size:30px;font-weight:800;margin:6px 0 18px;}

  .barchart{display:flex;align-items:flex-end;justify-content:space-between;height:110px;gap:6px;padding-top:20px;}
  .barchart .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .barchart .bar-val{font-size:11px;color:var(--text);margin-bottom:4px;font-weight:600;}
  .barchart .bar{width:70%;max-width:32px;border-radius:14px 14px 0 0;transform-origin:bottom;transition:height .5s var(--ease);animation:growY .6s var(--ease) both;}
  .barchart .bar-label{font-size:11px;color:var(--muted);margin-top:8px;}

  .type-avatar{width:64px;height:64px;border-radius:50%;background:var(--avatar-bg);display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0;}
  .type-info{flex:1;min-width:0;}
  .type-info .k1{font-size:12px;color:var(--muted);margin:0 0 2px;}
  .type-info .k2{font-size:17px;font-weight:800;margin:0;}
  .type-badge{display:inline-block;margin-top:6px;padding:4px 12px;border-radius:20px;color:#fff;font-size:12px;font-weight:700;}
  .chevron{color:var(--gray-text);flex-shrink:0;display:flex;}

  .stage-card .card-row{margin-bottom:10px;}
  .stage-name{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;}
  .icon-box{width:28px;height:28px;border-radius:8px;background:var(--blue-tint);display:flex;align-items:center;justify-content:center;font-size:16px;}
  .stage-count{font-size:13px;color:var(--muted);font-weight:600;}
  .progress-track{height:8px;background:var(--gray);border-radius:8px;overflow:hidden;margin-bottom:10px;}
  .progress-fill{height:100%;background:var(--primary);border-radius:8px;transition:width .6s var(--ease);}
  .stage-sub{font-size:13px;color:var(--muted);margin:0;}
  .challenge-chip{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--primary-tint);color:var(--primary-text);font-size:12.5px;font-weight:700;}

  .today-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
  .today-item:last-child{border-bottom:none;}
  .item-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .item-body{flex:1;min-width:0;}
  .item-name{font-weight:700;font-size:15px;margin:0;}
  .item-sub{font-size:12.5px;color:var(--muted);margin:2px 0 0;}
  .item-amt{font-weight:800;font-size:15px;white-space:nowrap;text-align:right;}
  .item-tag{font-size:11.5px;font-weight:700;margin-top:2px;display:block;text-align:right;}
  .tag-need{color:var(--primary-text);}
  .tag-impulse{color:var(--danger-text);}
  .today-total-row{display:flex;justify-content:space-between;padding-top:10px;font-weight:700;font-size:14px;}
  .today-total-row .val{color:var(--primary-text);font-weight:800;}
  .src-badge{display:inline-block;margin-left:6px;vertical-align:2px;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:6px;}
  .src-badge.auto{background:var(--blue-tint);color:var(--auto-text);}
  .src-badge.receipt{background:var(--warn-bg);color:var(--warn-text);}

  .notice-banner{margin:14px 16px 20px;padding:14px 16px;background:var(--warn-bg);border-radius:14px;display:flex;align-items:center;gap:10px;color:var(--warn-text);font-size:13px;font-weight:600;}

  /* ---- liquid glass ---- */
  .lg-base,.lg-sheen,.lg-edge,.lg-light-wrap{position:absolute;inset:0;border-radius:inherit;pointer-events:none;}
  .lg-base{background:var(--glass-bg);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);transition:background-color .3s;}
  .lg-sheen{background:linear-gradient(to bottom, var(--glass-sheen), transparent 70%);}
  .lg-edge{border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow);}
  .lg-light-wrap{overflow:hidden;}
  .lg-light{position:absolute;width:200%;height:200%;top:-50%;left:-50%;background:radial-gradient(circle at 30% 30%, var(--glass-light) 0%, transparent 50%);transition:transform .5s ease;}
  .lg-pill{position:absolute;pointer-events:none;z-index:1;transition:transform 500ms var(--spring);}
  .lg-pill > span{position:absolute;inset:0;border-radius:inherit;}
  .p-solid{background:var(--pill-solid);box-shadow:var(--pill-shadow);transition:opacity .2s;}
  .p-glass{opacity:0;background:linear-gradient(135deg, rgba(255,255,255,0.4), rgba(255,255,255,0.15), rgba(255,255,255,0.25));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--pill-drag-shadow);transition:opacity .2s;}
  .p-edge{border:1px solid var(--pill-edge);transition:border-color .2s;}
  .lg-pill > span.p-hi{inset:2px 22% auto 22%;height:33%;background:linear-gradient(to bottom, #fff, transparent);opacity:.8;transition:opacity .2s;}
  .p-caustic{opacity:0;background:radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.6) 0%, transparent 40%), radial-gradient(ellipse at 70% 80%, rgba(255,255,255,0.3) 0%, transparent 30%);transition:opacity .2s;}
  .dragging .p-solid{opacity:0;}
  .dragging .p-glass,.dragging .p-caustic{opacity:1;}
  .dragging .lg-pill > span.p-hi{opacity:.4;}
  .dragging .p-edge{border-color:rgba(255,255,255,0.5);}

  .bottom-nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:calc(100% - 32px);max-width:448px;height:66px;border-radius:33px;display:flex;padding:0 6px;z-index:50;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;transition:transform .45s var(--ease), opacity .3s ease;}
  .bottom-nav.dragging{cursor:grabbing;}
  .bottom-nav.hidden{transform:translate(-50%, 160%);opacity:0;pointer-events:none;}
  .bottom-nav .lg-pill{top:6px;bottom:6px;left:6px;width:calc((100% - 12px) / 4);border-radius:27px;}
  .bottom-nav .lg-base{background:var(--nav-glass-bg);backdrop-filter:blur(1.5px) saturate(140%);-webkit-backdrop-filter:blur(1.5px) saturate(140%);}
  .bottom-nav .lg-sheen{opacity:.35;}
  .bottom-nav .lg-edge{border-color:var(--nav-glass-edge);box-shadow:var(--nav-glass-shadow);}
  .bottom-nav .p-solid{background:var(--nav-pill-bg);box-shadow:var(--nav-pill-shadow);backdrop-filter:blur(1.5px);-webkit-backdrop-filter:blur(1.5px);}
  .bottom-nav .p-edge{border-color:var(--nav-glass-edge);}
  .bottom-nav .lg-pill > span.p-hi{display:none;}
  .bottom-nav .nav-item{text-shadow:0 0 6px var(--nav-label-halo), 0 0 2px var(--nav-label-halo);}
  .bottom-nav .nav-item svg{filter:drop-shadow(0 0 3px var(--nav-label-halo));}
  .nav-item{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:var(--muted);font-size:11px;font-weight:600;cursor:inherit;}
  .nav-item svg{transition:transform .35s var(--spring);}
  .nav-item.active{color:var(--primary-text);}
  .nav-item.active svg{transform:scale(1.08);}
  .bottom-nav.dragging .nav-item.active{color:var(--muted);}
  .bottom-nav.dragging .nav-item.active svg{transform:none;}
  .bottom-nav.dragging .nav-item.at{color:var(--primary-text);}
  .bottom-nav.dragging .nav-item.at svg{transform:scale(1.12);}
  .nav-item:active:not(:disabled){transform:none;}

  .lg-switch{position:relative;width:72px;height:40px;border-radius:20px;flex-shrink:0;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;}
  .lg-switch.dragging{cursor:grabbing;}
  .lg-switch .lg-pill{top:4px;bottom:4px;left:4px;width:28px;border-radius:14px;}
  .lg-switch .p-solid{background:#FFFFFF;box-shadow:0 2px 8px rgba(0,0,0,0.15);}
  .lg-labels{position:absolute;inset:0;display:flex;align-items:center;padding:0 4px;z-index:10;pointer-events:none;}
  .lg-labels .lbl{width:36px;display:flex;justify-content:center;color:var(--muted);transition:color .2s;}
  .lg-labels .lbl:first-child{width:28px;}
  .lg-labels .lbl:last-child{margin-left:auto;width:28px;}
  .lg-switch[data-at="0"] .lbl.sun, .lg-switch[data-at="1"] .lbl.moon{color:rgba(0,0,0,0.85);}

  .notice{margin-top:18px;background:var(--warn-bg);color:var(--warn-text);border-radius:14px;padding:13px 15px;font-size:13px;line-height:1.6;font-weight:600;display:flex;gap:8px;}
  .search{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;background:var(--input-bg);border-radius:14px;margin-top:20px;color:var(--muted);}
  .search input{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:15px;color:var(--text);}
  .search input::placeholder{color:var(--placeholder);}
  .bank-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;}
  .bank-tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px;min-height:88px;border-radius:14px;background:var(--card);border:1.5px solid var(--border);font-size:13px;line-height:1.3;}
  .bank-tile.on{border-color:var(--primary);background:var(--primary-tint);}
  .bank-dot{width:34px;height:34px;border-radius:50%;background:var(--gray);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;transition:background-color .2s, color .2s;}
  .bank-tile.on .bank-dot{background:var(--primary);color:#fff;}
  .inline-link{background:none;border:none;color:var(--primary-text);font-size:13px;font-weight:600;padding:16px 0 0;text-align:left;}
  .select-row{display:flex;justify-content:space-between;align-items:center;width:100%;height:56px;padding:0 16px;background:var(--input-bg);border-radius:14px;border:none;font-size:16px;font-weight:700;}
  .select-row .sr-bank{display:flex;align-items:center;gap:10px;}
  .select-row .sr-dot{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;}
  .select-row .sr-change{font-size:13px;color:var(--primary-text);}
  .info-row{display:flex;gap:8px;align-items:flex-start;margin-top:18px;font-size:13px;line-height:1.6;color:var(--muted);}
  .deposit-card{margin-top:22px;background:var(--card);border-radius:16px;padding:16px 18px;}
  .hl{background:var(--warn-bg);color:var(--warn-text);padding:2px 7px;border-radius:6px;font-weight:800;letter-spacing:1px;}
  .digits{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:26px;}
  .digits.error{animation:shake .45s ease both;}
  .digit{width:100%;height:64px;text-align:center;font-size:26px;font-weight:800;font-family:inherit;border-radius:14px;border:2px solid transparent;background:var(--input-bg);color:var(--text);outline:none;transition:border-color .2s;}
  .digit:focus{border-color:var(--primary);}
  .digits.error .digit{border-color:var(--danger);}
  .verify-meta{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px;}
  .err-text{color:var(--danger-text);font-size:13px;font-weight:700;margin-top:10px;}
  .done-check{width:88px;height:88px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;margin:56px auto 0;animation:popBig .55s cubic-bezier(.2,1.4,.4,1) both;}
  .done-check path{stroke-dasharray:30;animation:draw .5s .35s ease both;}
  .summary{margin-top:30px;background:var(--card);border-radius:16px;padding:6px 18px;}
  .summary-row{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);font-size:14.5px;}
  .summary-row:last-child{border-bottom:none;}
  .summary-row span:first-child{color:var(--muted);}
  .summary-row b.warn{color:var(--tag-warn-text);}
  .switch{position:relative;width:52px;height:32px;border-radius:16px;border:none;background:var(--gray-seg);flex-shrink:0;padding:0;transition:background-color .25s;}
  .switch.on{background:var(--primary);}
  .switch i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .28s var(--ease);}
  .switch.on i{transform:translateX(20px);}
  .set-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);}
  .set-row:last-child{border-bottom:none;}
  .set-row .sr-body{flex:1;}
  .set-row .sr-t{font-size:15px;font-weight:700;}
  .set-row .sr-d{font-size:12.5px;color:var(--muted);margin-top:3px;}
  .outline-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;height:52px;border-radius:14px;background:transparent;border:1.5px dashed var(--gray-seg);font-size:14.5px;font-weight:700;margin-top:14px;}
  .danger-outline{width:100%;height:52px;border-radius:14px;background:transparent;border:1.5px solid var(--danger-tint);color:var(--danger-text);font-size:15px;font-weight:700;}
  .spinner{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;display:inline-block;}

  /* camera */
  .camera{background:#0E1116;color:#fff;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}
  .camera .appbar{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;}
  .camera .icon-btn.ghost{color:#fff;}
  .viewfinder{position:relative;margin:4px 20px;flex:1;min-height:400px;border-radius:24px;overflow:hidden;background:radial-gradient(circle at 50% 40%, #2A3139, #0E1116 75%);display:flex;align-items:center;justify-content:center;}
  .vf-corner{position:absolute;width:34px;height:34px;border:3px solid #fff;opacity:.9;}
  .vf-corner.tl{top:24px;left:24px;border-right:0;border-bottom:0;border-radius:10px 0 0 0;}
  .vf-corner.tr{top:24px;right:24px;border-left:0;border-bottom:0;border-radius:0 10px 0 0;}
  .vf-corner.bl{bottom:24px;left:24px;border-right:0;border-top:0;border-radius:0 0 0 10px;}
  .vf-corner.br{bottom:24px;right:24px;border-left:0;border-top:0;border-radius:0 0 10px 0;}
  .vf-hint{position:absolute;bottom:40px;left:0;right:0;text-align:center;font-size:13px;color:rgba(255,255,255,.8);}
  .paper{background:#FFFFFF;color:#222;width:200px;padding:16px 16px 20px;border-radius:6px;box-shadow:0 12px 34px rgba(0,0,0,.45);font-size:11.5px;font-family:ui-monospace, Menlo, Consolas, monospace;transform:rotate(-2deg);}
  .paper .p-store{font-weight:800;font-size:13px;text-align:center;font-family:inherit;}
  .paper .p-sep{border-top:1px dashed #999;margin:8px 0;}
  .paper .p-row{display:flex;justify-content:space-between;margin:3px 0;}
  .paper .p-total{font-weight:800;font-size:13px;}
  .scan-wrap{position:relative;}
  .scan-line{position:absolute;left:-8px;right:-8px;height:3px;background:#6DBE6D;box-shadow:0 0 18px #6DBE6D;border-radius:2px;animation:scan 1.1s ease-in-out infinite alternate;}
  .scan-img{max-width:220px;max-height:320px;border-radius:8px;display:block;box-shadow:0 12px 34px rgba(0,0,0,.45);}
  .cam-controls{display:flex;align-items:center;justify-content:space-around;padding:22px 20px calc(30px + env(safe-area-inset-bottom));}
  .cam-side{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;color:#fff;font-size:12px;font-weight:600;width:72px;cursor:pointer;}
  .cam-side .cs-ic{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;}
  .shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:transparent;padding:5px;}
  .shutter span{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:transform .15s;}
  .shutter:active span{transform:scale(.88);}
  .scan-status{text-align:center;padding:26px 20px 40px;}
  .scan-status p{margin:0;}
  .scan-steps{display:flex;flex-direction:column;gap:8px;margin-top:16px;align-items:center;font-size:13px;color:rgba(255,255,255,.55);}
  .scan-steps .done{color:#fff;}
  .recog{background:var(--card);border-radius:16px;padding:16px 18px;margin-top:18px;}
  .recog-head{display:flex;align-items:center;gap:12px;}
  .recog-thumb{width:52px;height:52px;border-radius:10px;background:var(--warn-bg);color:var(--warn-text);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
  .recog-thumb img{width:100%;height:100%;object-fit:cover;}
  .recog-rows{margin-top:12px;border-top:1px solid var(--border);padding-top:10px;font-size:13.5px;}
  .recog-rows div{display:flex;justify-content:space-between;padding:4px 0;}
  .recog-rows .tot{font-weight:800;border-top:1px dashed var(--border);margin-top:6px;padding-top:10px;}
  .ok-tag{font-size:11px;font-weight:800;color:var(--primary-text);background:var(--primary-tint);padding:3px 8px;border-radius:8px;}

  /* guide */
  .seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--gray);border-radius:14px;padding:4px;margin:6px 16px 4px;}
  .seg-ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / 3);background:var(--card);border-radius:10px;box-shadow:var(--shadow);transition:transform .35s var(--ease);}
  .seg button{position:relative;z-index:1;height:40px;border:none;background:none;font-size:13.5px;font-weight:700;color:var(--muted);}
  .seg button.on{color:var(--text);}
  .g-step{display:flex;gap:14px;padding:12px 0;}

  .g-t{font-weight:800;font-size:15px;margin:0 0 4px;}

  .q-item:last-child{border-bottom:none;}

  .ex.good{background:var(--primary-tint);}
  .ex.bad{background:var(--danger-tint);}
  .ex-tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;margin-bottom:6px;color:#fff;}
  .ex.good .ex-tag{background:var(--primary);}
  .ex.bad .ex-tag{background:var(--danger);}
  .tip{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);color:var(--warn-text);border-radius:14px;padding:14px;font-size:13.5px;font-weight:600;line-height:1.55;}

  /* ai */
  .ai-hero .week-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--primary-text);background:var(--primary-tint);padding:4px 10px;border-radius:10px;}
  .week-bars{display:flex;align-items:flex-end;gap:8px;height:96px;margin-top:18px;}
  .wbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;}
  .wbar i{display:block;width:100%;max-width:24px;border-radius:8px 8px 3px 3px;background:var(--primary-tint2);transform-origin:bottom;animation:growY .6s var(--ease) both;}
  .wbar.max i{background:var(--primary);}
  .wbar small{font-size:11px;color:var(--muted);font-weight:700;}
  .cmp-row{display:flex;gap:10px;margin-top:16px;}
  .cmp{flex:1;border-radius:14px;padding:12px;}
  .cmp .c-l{font-size:12px;color:var(--muted);font-weight:700;}
  .cmp .c-v{font-size:19px;font-weight:800;margin-top:2px;}
  .cmp .c-d{font-size:11.5px;font-weight:700;margin-top:2px;}
  .sol{display:flex;gap:12px;background:var(--card);border-radius:16px;margin:0 16px 10px;padding:16px;box-shadow:var(--shadow);}
  .sol-num{width:28px;height:28px;border-radius:50%;background:var(--primary-tint);color:var(--primary-text);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;}
  .sol-t{font-size:15px;font-weight:800;margin:2px 0 3px;}
  .sol-o{font-size:12.5px;color:var(--muted);margin:0;}
  .sol-tip{font-size:14px;line-height:1.55;margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--gray);}
  .sol-act{background:none;border:none;color:var(--primary-text);font-size:13px;font-weight:700;padding:10px 0 0;}
  .section-label{font-size:14px;font-weight:800;color:var(--muted);padding:18px 20px 10px;}
  .challenge{background:var(--primary-tint);border-radius:16px;margin:4px 16px 0;padding:18px;}
  .challenge .ch-t{font-size:12.5px;font-weight:800;color:var(--primary-text);display:flex;align-items:center;gap:6px;}
  .challenge .ch-v{font-size:17px;font-weight:800;margin:6px 0 0;}
  .challenge .primary-btn{margin-top:14px;padding:14px;}
  .challenge .primary-btn.accepted{background:var(--card);color:var(--primary-text);}
  .skel{border-radius:10px;background:linear-gradient(90deg, var(--gray) 25%, color-mix(in srgb, var(--gray) 45%, var(--card)) 50%, var(--gray) 75%);background-size:200% 100%;animation:shimmer 1.3s linear infinite;}
  .ai-steps{display:flex;flex-direction:column;gap:12px;margin-top:18px;}
  .ai-step{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--muted);transition:color .3s;}
  .ai-step.done{color:var(--text);}
  .ai-step .st-ic{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--gray);color:#fff;transition:background-color .3s;}
  .ai-step.done .st-ic{background:var(--primary);}
  .ai-step.active .st-ic{background:transparent;color:var(--primary-text);}
  .disclaimer{font-size:12px;color:var(--muted);text-align:center;margin:16px 20px 0;line-height:1.6;}

  .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(30,40,30,0.92);color:#fff;padding:11px 20px;border-radius:20px;font-size:13.5px;font-weight:600;z-index:200;white-space:nowrap;animation:toastIn .3s var(--ease) both;}
  .toast.leaving{animation:toastOut .22s ease both;}
  :root[data-theme="dark"] .toast{background:rgba(228,236,228,.95);color:#10180F;}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .toast{background:rgba(228,236,228,.95);color:#10180F;}}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,12px);}to{opacity:1;transform:translate(-50%,0);}}
  @keyframes toastOut{from{opacity:1;transform:translate(-50%,0);}to{opacity:0;transform:translate(-50%,8px);}}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
  }
</style>
</head>

Object.keys(PERSONAS).forEach(k=>{ PERSONAS[k].key=k; });
function pImg(p, size){ return '<img class="p-img" src="'+PERSONA_IMG[p.key]+'" alt="'+p.name+'" width="'+size+'" height="'+size+'" draggable="false">'; }
const PERSONA_ORDER = ['aura','joy','hyunjae','melon','jay'];

/* ---------------- HELPERS ---------------- */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(n){ return Math.abs(n).toLocaleString('ko-KR')+'원'; }
function signed(n){ return n.toLocaleString('ko-KR')+'원'; }
function isDark(){
  const t = document.documentElement.getAttribute('data-theme');
  if(t) return t==='dark';
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function bankLabel(n){ return /뱅크|금고|우체국|은행$|카드|머니/.test(n) ? n : n+'은행'; }
function todaysTxns(){ return state.transactions.filter(t=>t.dateKey===TODAY_KEY); }
function sortTxns(){ state.transactions.sort((a,b)=> a.dateKey===b.dateKey ? 0 : (a.dateKey < b.dateKey ? 1 : -1)); }
function groupByDate(){
  const map = {}; const order = [];
  state.transactions.forEach(t=>{ if(!map[t.dateKey]){ map[t.dateKey]=[]; order.push(t.dateKey); } map[t.dateKey].push(t); });
  return order.map(k=>({key:k,label:DATE_LABELS[k]||k,items:map[k]}));
}
function catTotals(list){
  list = list || state.transactions;
  const totals = {}; CAT_ORDER.forEach(c=>totals[c]=0);
  list.forEach(t=>{ if(totals[t.cat]!==undefined) totals[t.cat]+=Math.abs(t.amount); });
  return totals;
}
function classifyTotals(list){
  list = list || state.transactions;
  let need=0, impulse=0, none=0;
  list.forEach(t=>{ const a=Math.abs(t.amount); if(t.cls==='need') need+=a; else if(t.cls==='impulse') impulse+=a; else none+=a; });
  return {need, impulse, none};
}
function totalSpend(list){ return (list||state.transactions).reduce((s,t)=>s+Math.abs(t.amount),0); }
function conicGradient(entries, span, from){
  span = span || 360;
  const total = entries.reduce((s,e)=>s+e.value,0) || 1;
  let acc = 0; const stops=[];
  entries.forEach(e=>{
    if(e.value<=0) return;
    const start = acc/total*span; acc += e.value; const end = acc/total*span;
    stops.push(e.color+' '+start.toFixed(2)+'deg '+(end-0.8).toFixed(2)+'deg', 'var(--card) '+(end-0.8).toFixed(2)+'deg '+end.toFixed(2)+'deg');
  });
  if(span<360) stops.push('transparent '+span+'deg 360deg');
  return 'conic-gradient(from '+(from||0)+'deg, '+stops.join(',')+')';
}
function dataSig(){ return state.transactions.map(t=>t.id+':'+t.cat+':'+t.cls).join('|'); }

/* ---------------- AI REPORT ---------------- */
function buildReport(){
  const list = state.transactions;
  const total = totalSpend(list);
  const byCat = catTotals(list);
  const top = CAT_ORDER.reduce((a,b)=> byCat[a]>=byCat[b]?a:b);
  const cls = classifyTotals(list);
  const impulsePct = total ? Math.round(cls.impulse/total*100) : 0;
  const needPct = total ? Math.round(cls.need/total*100) : 0;
  const days = WEEK.map(w=>({d:w.d, v:list.filter(t=>t.dateKey===w.key).reduce((s,t)=>s+Math.abs(t.amount),0)}));
  const maxDay = days.reduce((a,b)=> a.v>=b.v?a:b);
  const unsorted = list.filter(t=>!t.cls || t.cat==='unset').length;
  const catAdvice = {
    cafe:'음료는 일주일에 두 번만 사기로 정해 보세요. 물병을 챙기면 훨씬 쉬워요.',
    snack:'간식을 사기 전에 이번 주 간식비가 얼마 남았는지 먼저 확인해 보세요.',
    game:'게임 결제는 한 달 예산을 먼저 정하고, 결제하기 전에 하루만 기다려 보세요.',
    shopping:'사고 싶은 물건은 장바구니에 담아 두고 다음 날 다시 확인해 보세요.',
    beauty:'꾸미기 소비는 한 달에 쓸 금액을 정해 두면 고민이 줄어요.',
    food:'식비는 꼭 필요한 소비예요. 간식·음료와 겹치지 않는지만 살펴봐요.',
    transport:'교통비는 필요한 소비예요. 가까운 거리는 걸어 보는 것도 좋아요.'
  };
  const sols = [];
  sols.push({title:CATS[top].full+'에 가장 많이 썼어요', obs:fmt(byCat[top])+' · 이번 주 지출의 '+Math.round(byCat[top]/(total||1)*100)+'%', tip:catAdvice[top]});
  const diff = impulsePct - LAST_WEEK.impulse;
  if(impulsePct >= 25){
    sols.push({title:'충동 소비가 '+impulsePct+'%예요', obs:'지난주 '+LAST_WEEK.impulse+'%보다 '+Math.abs(diff)+'%p '+(diff<=0?'줄었어요':'늘었어요'),
      tip: state.diagnosis ? PERSONAS[state.diagnosis].aiTip : '사고 싶은 게 생기면 10분만 기다려 보세요. 그래도 필요하면 그때 사도 늦지 않아요.'});
  } else {
    sols.push({title:'충동 소비를 잘 참았어요', obs:'충동 소비 '+impulsePct+'% · 지난주 '+LAST_WEEK.impulse+'%', tip:'지금처럼 사기 전에 한 번 더 생각하는 습관을 이어가요.'});
  }
  if(unsorted>0){
    sols.push({title:'아직 정리하지 않은 소비가 '+unsorted+'건 있어요', obs:'용도나 필요·충동을 고르지 않았어요', tip:'돌아보기에서 정리하면 다음 주 분석이 더 정확해져요.', action:{label:'돌아보기로 가기 →', act:'go-reflect'}});
  } else {
    sols.push({title:maxDay.d+'요일에 가장 많이 썼어요', obs:fmt(maxDay.v)+' 지출', tip:'그날 어떤 상황이었는지 한 줄 일지에 남겨 보세요. 반복되는 패턴이 보여요.'});
  }
  const impulseByCat = {};
  list.filter(t=>t.cls==='impulse' && CATS[t.cat]).forEach(t=>{ impulseByCat[t.cat]=(impulseByCat[t.cat]||0)+Math.abs(t.amount); });
  const chCat = Object.keys(impulseByCat).sort((a,b)=>impulseByCat[b]-impulseByCat[a])[0] || top;
  const base = impulseByCat[chCat] || byCat[chCat] || 5000;
  const budget = Math.max(1000, Math.floor(base*0.7/1000)*1000);
  const delta = total - LAST_WEEK.total;
  return {
    total, needPct, impulsePct, days, maxDay,
    headline:'이번 주 '+fmt(total)+'을 썼어요',
    delta:'지난주보다 '+fmt(Math.abs(delta))+' '+(delta>=0?'더':'덜')+' 썼어요',
    deltaUp: delta>=0,
    solutions:sols,
    challenge:'다음 주 '+CATS[chCat].full+' '+fmt(budget)+' 이하로 쓰기'
  };
}

function computeQuizResult(){
  const sums = {}; PERSONA_ORDER.forEach(k=>sums[k]=0);
  QUIZ.forEach((q,i)=>{ sums[q.grp] += (state.quizAnswers[i]||0); });
  let best = PERSONA_ORDER[0];
  PERSONA_ORDER.forEach(k=>{ if(sums[k] > sums[best]) best = k; });
  return {sums, best};
}

/* ---------------- RECEIPT FLOW ---------------- */
function receiptPaper(r){
  const total = r.items.reduce((s,i)=>s+i[1],0);
  return '<div class="paper"><div class="p-store">'+r.store+'</div><div style="text-align:center;margin-top:3px">'+r.time+'</div><div class="p-sep"></div>'+
    r.items.map(i=>'<div class="p-row"><span>'+i[0]+'</span><span>'+i[1].toLocaleString('ko-KR')+'</span></div>').join('')+
    '<div class="p-sep"></div><div class="p-row p-total"><span>합계</span><span>'+total.toLocaleString('ko-KR')+'</span></div><div style="text-align:center;margin-top:10px;letter-spacing:2px">||| |||| || |||</div></div>';
}
function renderReceipt(step){
  const R = RECEIPTS[state.receipt.sample];

      '<div class="viewfinder"><span class="vf-corner tl"></span><span class="vf-corner tr"></span><span class="vf-corner bl"></span><span class="vf-corner br"></span>'+receiptPaper(R)+
      '<div class="vf-hint">영수증이 네모 안에 들어오게 맞춰 주세요</div></div>'+
      '<div class="cam-controls">'+
        '<label class="cam-side"><span class="cs-ic">'+icon('image',22)+'</span>앨범<input type="file" accept="image/*" data-input="receipt-file" style="display:none"></label>'+
        '<button class="shutter" data-action="receipt-shoot" aria-label="촬영"><span></span></button>'+
        '<button class="cam-side" data-action="flow-to-manual"><span class="cs-ic">'+icon('pen',20)+'</span>직접 입력</button>'+
      '</div></div>';
  }
  if(step==='scan'){
    const img = state.receipt.image;
    const st = state.receipt.scanStep;
    const steps = ['가게 이름 찾기','품목과 금액 읽기','카테고리 추천하기'];
    return '<div class="flow camera">'+appBar('영수증 읽는 중')+
      '<div class="viewfinder"><div class="scan-wrap">'+(img?'<img class="scan-img" src="'+img+'" alt="찍은 영수증">':receiptPaper(R))+'<div class="scan-line"></div></div></div>'+
      '<div class="scan-status"><p style="font-weight:800;font-size:16px">영수증을 읽고 있어요</p>'+
      '<div class="scan-steps">'+steps.map((s,i)=>'<div class="'+(i<st?'done':'')+'" style="display:flex;align-items:center;gap:6px">'+(i<st?icon('check',14):'<span class="spinner" style="width:12px;height:12px;opacity:'+(i===st?1:0)+'"></span>')+s+'</div>').join('')+'</div></div>'+
    '</div>';
  }
  if(step==='confirm'){
    const img = state.receipt.image;
    const total = R.items.reduce((s,i)=>s+i[1],0);
    return '<div class="flow">'+appBar('인식 결과 확인')+'<div class="flow-body">'+
      '<div class="recog pop-in"><div class="recog-head"><div class="recog-thumb">'+(img?'<img src="'+img+'" alt="">':icon('receipt',24))+'</div>'+
        '<div style="flex:1;min-width:0"><div style="font-weight:800;font-size:15.5px">'+R.store+'</div><div class="muted-sm" style="margin-top:3px">'+R.time+'</div></div><span class="ok-tag">인식 완료</span></div>'+
        '<div class="recog-rows">'+R.items.map(i=>'<div><span>'+i[0]+'</span><span>'+i[1].toLocaleString('ko-KR')+'원</span></div>').join('')+'<div class="tot"><span>합계</span><span>'+total.toLocaleString('ko-KR')+'원</span></div></div>'+
        (img?'<p class="muted-sm" style="margin-top:10px">사진 속 글자 인식은 가정이에요. 예시 결과를 보여 드려요.</p>':'')+
      '</div>'+
      '<p class="muted-sm" style="margin:18px 0 10px;font-size:13px">잘못 읽은 부분이 있으면 고쳐 주세요.</p>'+
      formFields()+
      '<div class="flow-cta"><button class="primary-btn" data-action="submit-receipt" '+(formValid()?'':'disabled')+'>등록하기</button>'+
      '<button class="sub-link" data-action="receipt-retake">다시 찍기</button></div>'+
    '</div></div>';
  }
  return '';
}

/* ---------------- MORPH (in-place DOM patch keeps transitions & focus) ---------------- */
function isKeyed(n){ return n.nodeType===1 && n.hasAttribute('data-key'); }
function morph(a, b){
  if(a.nodeType!==b.nodeType || a.nodeName!==b.nodeName || (a.nodeType===1 && a.getAttribute('data-key')!==b.getAttribute('data-key'))){ a.replaceWith(b); return; }
  if(a.nodeType!==1){ if(a.nodeValue!==b.nodeValue) a.nodeValue=b.nodeValue; return; }
  for(const at of Array.from(a.attributes)) if(!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  for(const at of Array.from(b.attributes)) if(a.getAttribute(at.name)!==at.value) a.setAttribute(at.name, at.value);
  if(a.nodeName==='INPUT' || a.nodeName==='TEXTAREA'){
    if(a.type==='file') return;
    const v = a.nodeName==='TEXTAREA' ? b.value : (b.getAttribute('value')||'');
    if(document.activeElement!==a && a.value!==v) a.value = v;
    if(a.nodeName==='TEXTAREA') return;
  }
  morphChildren(a, b);
}
function morphChildren(a, b){
  const oc = Array.from(a.childNodes), nc = Array.from(b.childNodes);
  if(!nc.some(isKeyed) && !oc.some(isKeyed)){
    for(let i=0;i<nc.length;i++){ if(i<oc.length) morph(oc[i], nc[i]); else a.appendChild(nc[i]); }
    for(let i=nc.length;i<oc.length;i++) oc[i].remove();
    return;
  }
  const map = new Map();
  oc.forEach(n=>{ if(isKeyed(n)) map.set(n.getAttribute('data-key'), n); else n.remove(); });
  let ref = a.firstChild;
  nc.forEach(n=>{
    const k = isKeyed(n) ? n.getAttribute('data-key') : null;
    const match = k ? map.get(k) : null;
    if(match){
      map.delete(k);
      if(match!==ref) a.insertBefore(match, ref); else ref = ref.nextSibling;
      morph(match, n);
    } else {
      a.insertBefore(n, ref);
    }
  });
  map.forEach(n=>n.remove());
}
function patch(el, html){ const tmp = el.cloneNode(false); tmp.innerHTML = html; morphChildren(el, tmp); }

/* ---------------- MASTER RENDER ---------------- */
let lastKey = null, navDir = null, focusSel = null;
const scrollMemo = {};
function screenKey(){
  if(state.flow) return 'flow:'+state.flow.type+':'+(state.flow.step||'');
  if(state.diagView) return 'diag:'+state.diagView;
  return state.tab + (state.tab==='reflect' ? ':'+state.reflectView : '');
}
function screenHTML(){
  const F = state.flow;
  if(F){
    if(F.type==='bank') return renderBankFlow(F.step);
    if(F.type==='manage') return renderManage();
    if(F.type==='receipt') return renderReceipt(F.step);
    if(F.type==='guide') return renderGuide();
    if(F.type==='ai') return renderAI();
  }
  if(state.diagView==='intro') return renderDiagnosisIntro();
  if(state.diagView==='quiz') return renderQuiz();
  if(state.diagView==='result') return renderDiagnosisResult();
  if(state.tab==='home') return renderHome();
  if(state.tab==='ledger') return renderLedger();
  if(state.tab==='reflect') return renderReflect();
  return renderStage();
}
let modalTimer = null, toastTimer = null;
function render(){
  const key = screenKey();
  const view = document.getElementById('view');
  const html = screenHTML();
  if(key!==lastKey){
    if(lastKey) scrollMemo[lastKey] = window.scrollY;
    view.innerHTML = html;
    view.classList.remove('screen-fade','screen-push','screen-pop');
    void view.offsetWidth;
    view.classList.add('screen-'+(navDir||'fade'));
    window.scrollTo(0, navDir==='pop' ? (scrollMemo[key]||0) : 0);
    lastKey = key;
  } else {
    patch(view, html);
  }
  navDir = null;
  document.getElementById('root').classList.toggle('no-nav', !!state.flow);
  if(!(glassDrag && glassDrag.kind==='nav')) patch(document.getElementById('nav-root'), renderNav());
  patch(document.getElementById('fab-root'), renderFab());

  const mroot = document.getElementById('modal-root');
  const cur = mroot.firstElementChild;
  if(state.modal){
    clearTimeout(modalTimer);
    if(!cur || cur.classList.contains('closing')) mroot.innerHTML = modalHTML(); else patch(mroot, modalHTML());
    document.body.style.overflow = 'hidden';
  } else if(cur && !cur.classList.contains('closing')){
    cur.classList.add('closing');
    modalTimer = setTimeout(()=>{ mroot.innerHTML=''; }, 240);
    document.body.style.overflow = '';
  }
  state.modalDir = null;

  const troot = document.getElementById('toast-root');
  const tcur = troot.firstElementChild;
  if(state.toast){
    const th = '<div class="toast" role="status" data-key="'+state.toast.id+'">'+esc(state.toast.msg)+'</div>';
    if(!tcur || tcur.getAttribute('data-key')!==String(state.toast.id)) troot.innerHTML = th;
  } else if(tcur && !tcur.classList.contains('leaving')){
    tcur.classList.add('leaving');
    setTimeout(()=>{ if(!state.toast) troot.innerHTML=''; }, 220);
  }

  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', getComputedStyle(document.documentElement).getPropertyValue('--bg').trim());

  if(focusSel){ const el = document.querySelector(focusSel); if(el){ el.focus(); } focusSel = null; }
}
function showToast(msg){
  state.toast = {msg, id:Date.now()};
  render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ state.toast=null; render(); }, 1900);
}

/* ---------------- LIQUID GLASS DRAG (nav pill & theme switch) ---------------- */
const DRAG_THRESHOLD = 3, ELASTIC = 8;
let glassDrag = null, suppressClick = false;
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
document.addEventListener('pointerdown', function(e){
  const el = e.target.closest('[data-drag]');
  if(!el || e.button>0) return;
  const kind = el.dataset.drag;
  const pill = el.querySelector('.lg-pill');
  const count = kind==='theme' ? 2 : 4;
  const step = kind==='theme' ? 36 : pill.getBoundingClientRect().width;
  const cur = kind==='theme' ? (isDark()?1:0) : Math.max(0, NAV_KEYS.indexOf(state.tab));
  if(e.pointerType==='mouse') e.preventDefault();
  glassDrag = {el, kind, pill, count, step, cur, id:e.pointerId, startX:e.clientX, startPill:cur*step, x:cur*step, moved:false};
  if(el.setPointerCapture) el.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove', function(e){
  const d = glassDrag;
  if(!d || e.pointerId!==d.id) return;
  const dx = e.clientX - d.startX;
  if(Math.abs(dx) > DRAG_THRESHOLD) d.moved = true;
  if(!d.moved) return;
  d.x = clamp(d.startPill + dx, -ELASTIC, (d.count-1)*d.step + ELASTIC);
  d.el.classList.add('dragging');
  d.pill.style.transition = 'transform 150ms cubic-bezier(0.34, 1.56, 0.64, 1)';
  d.pill.style.transform = 'translateX('+d.x+'px) scale(1.08)';
  const at = clamp(Math.round(d.x/d.step), 0, d.count-1);
  const light = d.el.querySelector('.lg-light');
  if(d.kind==='theme'){
    d.el.dataset.at = at;
    if(light) light.style.transform = 'rotate('+(at?15:-15)+'deg)';
  } else {
    d.el.querySelectorAll('.nav-item').forEach((b,i)=>b.classList.toggle('at', i===at));
    if(light) light.style.transform = 'rotate('+((at-1.5)*10)+'deg)';
  }
});
function endGlassDrag(e, cancelled){
  const d = glassDrag;
  if(!d || e.pointerId!==d.id) return;
  glassDrag = null;
  let idx = d.cur;
  if(!cancelled){
    if(d.moved) idx = clamp(Math.round(d.x/d.step), 0, d.count-1);
    else {
      const rect = d.el.getBoundingClientRect();
      const rel = e.clientX - rect.left;
      idx = d.kind==='theme' ? (rel > rect.width/2 ? 1 : 0) : clamp(Math.floor((rel-6)/d.step), 0, d.count-1);
    }
  }
  d.el.classList.remove('dragging');
  d.el.querySelectorAll('.nav-item.at').forEach(b=>b.classList.remove('at'));
  suppressClick = true;
  setTimeout(()=>{ suppressClick = false; }, 50);
  if(d.kind==='theme'){
    if(idx!==d.cur) setTheme(idx ? 'dark' : 'light');
  } else if(!cancelled){
    goTab(NAV_KEYS[idx]);
  }
  render();
}
document.addEventListener('pointerup', e=>endGlassDrag(e, false));
document.addEventListener('pointercancel', e=>endGlassDrag(e, true));
document.addEventListener('keydown', function(e){
  const sw = e.target.closest && e.target.closest('[data-drag="theme"]');
  if(sw && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); setTheme(isDark()?'light':'dark'); render(); document.querySelector('[data-drag="theme"]').focus(); }
});

/* ---------------- EVENTS ---------------- */
document.addEventListener('click', function(e){
  if(e.target.closest('[data-drag]') && (suppressClick || e.detail>0)) return;
  if(e.target.matches('[data-overlay], .sheet-wrap')){ state.modal=null; render(); return; }
  const nav = e.target.closest('[data-nav]');
  if(nav){ goTab(nav.dataset.nav); render(); return; }
  const act = e.target.closest('[data-action]');
  if(act){
    if(act.disabled) return;
    const fn = ACTIONS[act.dataset.action];
    if(fn){ const r = fn(act); if(r!=='rendered') render(); }
    return;
  }
  const catBtn = e.target.closest('[data-cat]');
  if(catBtn && state.form){ state.form.cat = catBtn.dataset.cat; render(); return; }
  const moodBtn = e.target.closest('[data-mood]');
  if(moodBtn){ state.mood = moodBtn.dataset.mood; render(); return; }
  const clsBtn = e.target.closest('[data-classify]');
  if(clsBtn){
    const t = state.transactions.find(x=>x.id===Number(clsBtn.dataset.classify));
    if(t) t.cls = clsBtn.dataset.val;
    render(); return;
  }
  const likert = e.target.closest('[data-answer]');
  if(likert){ state.quizAnswers[state.quizIndex] = Number(likert.dataset.answer); render(); return; }
});

document.addEventListener('input', function(e){
  const el = e.target; const k = el.dataset && el.dataset.input;
  if(!k || k==='receipt-file') return;
  if(k==='name') state.form.name = el.value;
  else if(k==='amount') state.form.amount = el.value;
  else if(k==='memo') state.form.memo = el.value;
  else if(k==='diary') state.diaryText = el.value;
  else if(k==='bank-search') state.bank.search = el.value;
  else if(k==='acct'){ el.value = el.value.replace(/\D/g,'').slice(0,14); state.acct.number = el.value; }
  else if(k==='owner') state.acct.owner = el.value;
  else if(k==='digit'){
    const i = +el.dataset.i;
    const v = el.value.replace(/\D/g,'').slice(-1);
    el.value = v; state.verify.digits[i] = v; state.verify.error = false;
    if(v && i<3) focusSel = '[data-input="digit"][data-i="'+(i+1)+'"]';
  }
  render();
});
document.addEventListener('keydown', function(e){
  const el = e.target;
  if(el.dataset && el.dataset.input==='digit' && e.key==='Backspace' && !el.value){
    const i = +el.dataset.i;
    if(i>0){ const prev = document.querySelector('[data-input="digit"][data-i="'+(i-1)+'"]'); if(prev){ prev.focus(); } }
  }
  if(e.key==='Escape' && state.modal){ state.modal=null; render(); }
});
document.addEventListener('change', function(e){
  const el = e.target;
  if(el.dataset && el.dataset.input==='receipt-file' && el.files && el.files[0]){
    const reader = new FileReader();
    reader.onload = ()=> startReceiptScan(reader.result);
    reader.readAsDataURL(el.files[0]);
  }
});
if(window.matchMedia){
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const onChange = ()=>{ if(!document.documentElement.getAttribute('data-theme')) render(); };
  if(mq.addEventListener) mq.addEventListener('change', onChange); else if(mq.addListener) mq.addListener(onChange);
}

render();
</script>
</body>
</html>
