  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:ui-sans-serif, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    -webkit-tap-highlight-color:transparent;
    transition:background-color var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  #root{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(100px + env(safe-area-inset-bottom));transition:padding var(--dur) var(--ease);}
  #root.no-nav{padding-bottom:0;}
  button{font-family:inherit;cursor:pointer;color:inherit;}
  button, .card, .txn-card, .chip, .pill, .mood-btn, .cat-btn, .bank-tile, .method, .likert-btn, .text-input{
    transition:background-color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease), opacity var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
  }
  button:active:not(:disabled){transform:scale(.97);}
  button:disabled{cursor:default;}
  :focus-visible{outline:2px solid var(--primary-text);outline-offset:2px;}

  /* screen transitions */
  @keyframes screenFade{from{opacity:0;}to{opacity:1;}}
  @keyframes screenPush{from{opacity:0;transform:translateX(36px);}to{opacity:1;transform:none;}}
  @keyframes screenPop{from{opacity:0;transform:translateX(-36px);}to{opacity:1;transform:none;}}
  .screen-fade{animation:screenFade var(--dur) var(--ease) both;}
  .screen-push{animation:screenPush var(--dur) var(--ease) both;}
  .screen-pop{animation:screenPop var(--dur) var(--ease) both;}
  @keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.98);}to{opacity:1;transform:none;}}
  .pop-in{animation:popIn var(--dur) var(--ease) both;}
  @keyframes growY{from{transform:scaleY(0);}to{transform:scaleY(1);}}
  @keyframes growX{from{transform:scaleX(0);}to{transform:scaleX(1);}}
  @keyframes spinIn{from{opacity:0;transform:rotate(-90deg) scale(.85);}to{opacity:1;transform:none;}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes fadeOut{from{opacity:1;}to{opacity:0;}}
  @keyframes sheetUp{from{transform:translateY(100%);}to{transform:none;}}
  @keyframes sheetDown{from{transform:none;}to{transform:translateY(100%);}}
  @keyframes slideR{from{opacity:0;transform:translateX(28px);}to{opacity:1;transform:none;}}
  @keyframes slideL{from{opacity:0;transform:translateX(-28px);}to{opacity:1;transform:none;}}
  @keyframes shake{10%,90%{transform:translateX(-2px);}20%,80%{transform:translateX(4px);}30%,50%,70%{transform:translateX(-6px);}40%,60%{transform:translateX(6px);}}
  @keyframes shimmer{from{background-position:200% 0;}to{background-position:-200% 0;}}
  @keyframes scan{from{top:4%;}to{top:92%;}}
  @keyframes popBig{0%{transform:scale(.4);opacity:0;}100%{transform:scale(1);opacity:1;}}
  @keyframes draw{from{stroke-dashoffset:30;}to{stroke-dashoffset:0;}}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  .from-right{animation:slideR var(--dur) var(--ease) both;}
  .from-left{animation:slideL var(--dur) var(--ease) both;}

  .header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 20px 4px;}
  .brand{font-size:20px;font-weight:800;margin:0 0 4px;}
  .brand-sm{font-size:13px;font-weight:700;color:var(--muted);margin:0;}
  .tagline{font-size:13px;color:var(--muted);margin:0;}
  .page-title{font-size:22px;font-weight:800;margin:2px 0 0;}
  .icon-btn{flex-shrink:0;width:40px;height:40px;border-radius:50%;border:none;background:var(--card);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow);}
  .icon-btn.ghost{background:transparent;box-shadow:none;color:var(--text);width:44px;height:44px;}
  .back-link{display:flex;align-items:center;gap:4px;color:var(--primary-text);font-size:14px;font-weight:600;padding:8px 20px 0;cursor:pointer;width:fit-content;background:none;border:none;}

  .card{background:var(--card);border-radius:16px;margin:14px 16px;padding:18px;box-shadow:var(--shadow);}
  .card-btn{display:flex;align-items:center;gap:14px;width:calc(100% - 32px);text-align:left;border:none;font:inherit;color:inherit;}
  .card-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .card-title{font-size:14px;color:var(--muted);font-weight:600;margin:0;}
  .sec-title{font-size:16px;color:var(--text);font-weight:800;margin:0;}
  .muted-sm{font-size:12.5px;color:var(--muted);margin:0;}
  .link-btn{background:none;border:none;color:var(--primary-text);font-size:12px;font-weight:600;display:flex;align-items:center;gap:2px;padding:0;}
  .text-btn{background:none;border:none;color:var(--primary-text);font-size:13.5px;font-weight:700;padding:10px 0 0;}
  .big-amount{font-size:30px;font-weight:800;margin:6px 0 18px;}

  .barchart{display:flex;align-items:flex-end;justify-content:space-between;height:110px;gap:6px;padding-top:20px;}
  .barchart .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .barchart .bar-val{font-size:11px;color:var(--text);margin-bottom:4px;font-weight:600;}
  .barchart .bar{width:70%;max-width:32px;border-radius:14px 14px 0 0;transform-origin:bottom;transition:height var(--dur-slow) var(--ease);animation:growY var(--dur-slow) var(--ease) both;}
  .barchart .bar-label{font-size:11px;color:var(--muted);margin-top:8px;}

  .type-avatar{width:64px;height:64px;border-radius:50%;background:var(--avatar-bg);display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0;}
  .type-info{flex:1;min-width:0;}
  .type-info .k1{font-size:12px;color:var(--muted);margin:0 0 2px;}
  .type-info .k2{font-size:17px;font-weight:800;margin:0;}
  .type-badge{display:inline-block;margin-top:6px;padding:4px 12px;border-radius:20px;color:#fff;font-size:12px;font-weight:700;}
  .chevron{color:var(--gray-text);flex-shrink:0;display:flex;}

  .stage-card .card-row{margin-bottom:10px;}
  .stage-name{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;}
  .icon-box{width:28px;height:28px;border-radius:8px;background:var(--blue-tint);display:flex;align-items:center;justify-content:center;font-size:16px;}
  .stage-count{font-size:13px;color:var(--muted);font-weight:600;}
  .progress-track{height:8px;background:var(--gray);border-radius:8px;overflow:hidden;margin-bottom:10px;}
  .progress-fill{height:100%;background:var(--primary);border-radius:8px;transition:width var(--dur-slow) var(--ease);}
  .stage-sub{font-size:13px;color:var(--muted);margin:0;}
  .challenge-chip{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--lime);color:var(--lime-ink);font-size:12.5px;font-weight:700;}

  .today-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
  .today-item:last-child{border-bottom:none;}
  .item-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .item-body{flex:1;min-width:0;}
  .item-name{font-weight:700;font-size:15px;margin:0;}
  .item-sub{font-size:12.5px;color:var(--muted);margin:2px 0 0;}
  .item-amt{font-weight:800;font-size:15px;white-space:nowrap;text-align:right;}
  .item-tag{font-size:11.5px;font-weight:700;margin-top:2px;display:block;text-align:right;}
  .tag-need{color:var(--primary-text);}
  .tag-impulse{color:var(--danger-text);}
  .today-total-row{display:flex;justify-content:space-between;padding-top:10px;font-weight:700;font-size:14px;}
  .today-total-row .val{color:var(--primary-text);font-weight:800;}
  .src-badge{display:inline-block;margin-left:6px;vertical-align:2px;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:6px;}
  .src-badge.auto{background:var(--blue-tint);color:var(--auto-text);}
  .src-badge.receipt{background:var(--warn-bg);color:var(--warn-text);}

  .notice-banner{margin:14px 16px 20px;padding:14px 16px;background:var(--warn-bg);border-radius:14px;display:flex;align-items:center;gap:10px;color:var(--warn-text);font-size:13px;font-weight:600;}

  /* ---- liquid glass ---- */
  .lg-base,.lg-sheen,.lg-edge,.lg-light-wrap{position:absolute;inset:0;border-radius:inherit;pointer-events:none;}
  .lg-base{background:var(--glass-bg);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);transition:background-color var(--dur);}
  .lg-sheen{background:linear-gradient(to bottom, var(--glass-sheen), transparent 70%);}
  .lg-edge{border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow);}
  .lg-light-wrap{overflow:hidden;}
  .lg-light{position:absolute;width:200%;height:200%;top:-50%;left:-50%;background:radial-gradient(circle at 30% 30%, var(--glass-light) 0%, transparent 50%);transition:transform var(--dur-slow) var(--ease);}
  .lg-pill{position:absolute;pointer-events:none;z-index:1;transition:transform 500ms var(--spring);}
  .lg-pill > span{position:absolute;inset:0;border-radius:inherit;}
  .p-solid{background:var(--pill-solid);box-shadow:var(--pill-shadow);transition:opacity var(--dur-fast);}
  .p-glass{opacity:0;background:linear-gradient(135deg, rgba(255,255,255,0.4), rgba(255,255,255,0.15), rgba(255,255,255,0.25));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--pill-drag-shadow);transition:opacity var(--dur-fast);}
  .p-edge{border:1px solid var(--pill-edge);transition:border-color var(--dur-fast);}
  .lg-pill > span.p-hi{inset:2px 22% auto 22%;height:33%;background:linear-gradient(to bottom, #fff, transparent);opacity:.8;transition:opacity var(--dur-fast);}
  .p-caustic{opacity:0;background:radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.6) 0%, transparent 40%), radial-gradient(ellipse at 70% 80%, rgba(255,255,255,0.3) 0%, transparent 30%);transition:opacity var(--dur-fast);}
  .dragging .p-solid{opacity:0;}
  .dragging .p-glass,.dragging .p-caustic{opacity:1;}
  .dragging .lg-pill > span.p-hi{opacity:.4;}
  .dragging .p-edge{border-color:rgba(255,255,255,0.5);}

  .bottom-nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:calc(100% - 32px);max-width:448px;height:66px;border-radius:33px;display:flex;padding:0 6px;z-index:50;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;transition:transform var(--dur-slow) var(--ease), opacity var(--dur) var(--ease);}
  .bottom-nav.dragging{cursor:grabbing;}
  .bottom-nav.hidden{transform:translate(-50%, 160%);opacity:0;pointer-events:none;}
  .bottom-nav .lg-pill{top:6px;bottom:6px;left:6px;width:calc((100% - 12px) / 4);border-radius:27px;}
  .bottom-nav .lg-base{background:var(--nav-glass-bg);backdrop-filter:blur(1.5px) saturate(140%);-webkit-backdrop-filter:blur(1.5px) saturate(140%);}
  .bottom-nav .lg-sheen{opacity:.35;}
  .bottom-nav .lg-edge{border-color:var(--nav-glass-edge);box-shadow:var(--nav-glass-shadow);}
  .bottom-nav .p-solid{background:var(--nav-pill-bg);box-shadow:var(--nav-pill-shadow);backdrop-filter:blur(1.5px);-webkit-backdrop-filter:blur(1.5px);}
  .bottom-nav .p-edge{border-color:var(--nav-glass-edge);}
  .bottom-nav .lg-pill > span.p-hi{display:none;}
  .bottom-nav .nav-item{text-shadow:0 0 6px var(--nav-label-halo), 0 0 2px var(--nav-label-halo);}
  .bottom-nav .nav-item svg{filter:drop-shadow(0 0 3px var(--nav-label-halo));}
  .nav-item{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:var(--muted);font-size:11px;font-weight:600;cursor:inherit;}
  .nav-item svg{transition:transform var(--dur) var(--spring);}
  .nav-item.active{color:var(--primary-text);}
  .nav-item.active svg{transform:scale(1.08);}
  .bottom-nav.dragging .nav-item.active{color:var(--muted);}
  .bottom-nav.dragging .nav-item.active svg{transform:none;}
  .bottom-nav.dragging .nav-item.at{color:var(--primary-text);}
  .bottom-nav.dragging .nav-item.at svg{transform:scale(1.12);}
  .nav-item:active:not(:disabled){transform:none;}

  .lg-switch{position:relative;width:72px;height:40px;border-radius:20px;flex-shrink:0;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;}
  .lg-switch.dragging{cursor:grabbing;}
  .lg-switch .lg-pill{top:4px;bottom:4px;left:4px;width:28px;border-radius:14px;}
  .lg-switch .p-solid{background:#FFFFFF;box-shadow:0 2px 8px rgba(0,0,0,0.15);}
  .lg-labels{position:absolute;inset:0;display:flex;align-items:center;padding:0 4px;z-index:10;pointer-events:none;}
  .lg-labels .lbl{width:36px;display:flex;justify-content:center;color:var(--muted);transition:color var(--dur-fast);}
  .lg-labels .lbl:first-child{width:28px;}

  .feat-list{display:flex;flex-direction:column;gap:10px;margin-top:26px;}
  .feat-row{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:16px;padding:14px 16px;font-size:14.5px;line-height:1.5;}
  .feat-ic{width:40px;height:40px;border-radius:12px;background:var(--primary-tint);color:var(--primary-text);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .check-all{display:flex;gap:12px;align-items:center;width:100%;margin-top:26px;padding:16px;border-radius:16px;background:var(--card);border:1.5px solid var(--border);text-align:left;font-size:16px;font-weight:800;}
  .check-all.on{border-color:var(--primary);}
  .check-all .cbox{width:26px;height:26px;}
  .consent-list{margin-top:10px;}
  .consent-item{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:6px 4px;background:none;border:none;text-align:left;font-size:14.5px;}
  .consent-item .ci-label{flex:1;}
  .view-btn{background:none;border:none;color:var(--muted);font-size:12.5px;text-decoration:underline;padding:8px 4px;}
  .consent-detail{font-size:12.5px;color:var(--muted);line-height:1.6;padding:0 4px 8px 38px;}
  .notice{margin-top:18px;background:var(--warn-bg);color:var(--warn-text);border-radius:14px;padding:13px 15px;font-size:13px;line-height:1.6;font-weight:600;display:flex;gap:8px;}
  .search{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;background:var(--input-bg);border-radius:14px;margin-top:20px;color:var(--muted);}
  .search input{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:15px;color:var(--text);}
  .search input::placeholder{color:var(--placeholder);}
  .bank-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;}
  .bank-tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px;min-height:88px;border-radius:14px;background:var(--card);border:1.5px solid var(--border);font-size:13px;line-height:1.3;}
  .bank-tile.on{border-color:var(--primary);background:var(--primary-tint);}
  .bank-dot{width:34px;height:34px;border-radius:50%;background:var(--gray);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;transition:background-color var(--dur-fast), color var(--dur-fast);}
  .bank-tile.on .bank-dot{background:var(--primary);color:#fff;}
  .inline-link{background:none;border:none;color:var(--primary-text);font-size:13px;font-weight:600;padding:16px 0 0;text-align:left;}
  .select-row{display:flex;justify-content:space-between;align-items:center;width:100%;height:56px;padding:0 16px;background:var(--input-bg);border-radius:14px;border:none;font-size:16px;font-weight:700;}
  .select-row .sr-bank{display:flex;align-items:center;gap:10px;}
  .select-row .sr-dot{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;}
  .select-row .sr-change{font-size:13px;color:var(--primary-text);}
  .info-row{display:flex;gap:8px;align-items:flex-start;margin-top:18px;font-size:13px;line-height:1.6;color:var(--muted);}
  .deposit-card{margin-top:22px;background:var(--card);border-radius:16px;padding:16px 18px;}
  .hl{background:var(--warn-bg);color:var(--warn-text);padding:2px 7px;border-radius:6px;font-weight:800;letter-spacing:1px;}
  .digits{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:26px;}
  .digits.error{animation:shake .45s ease both;}
  .digit{width:100%;height:64px;text-align:center;font-size:26px;font-weight:800;font-family:inherit;border-radius:14px;border:2px solid transparent;background:var(--input-bg);color:var(--text);outline:none;transition:border-color var(--dur-fast);}
  .digit:focus{border-color:var(--primary);}
  .digits.error .digit{border-color:var(--danger);}
  .verify-meta{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px;}
  .err-text{color:var(--danger-text);font-size:13px;font-weight:700;margin-top:10px;}
  .done-check{width:88px;height:88px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;margin:56px auto 0;animation:popBig var(--dur-slow) cubic-bezier(.2,1.4,.4,1) both;}
  .done-check path{stroke-dasharray:30;animation:draw .5s .35s ease both;}
  .summary{margin-top:30px;background:var(--card);border-radius:16px;padding:6px 18px;}
  .summary-row{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);font-size:14.5px;}
  .summary-row:last-child{border-bottom:none;}
  .summary-row span:first-child{color:var(--muted);}
  .summary-row b.warn{color:var(--tag-warn-text);}
  .switch{position:relative;width:52px;height:32px;border-radius:16px;border:none;background:var(--gray-seg);flex-shrink:0;padding:0;transition:background-color var(--dur-fast);}
  .switch.on{background:var(--primary);}
  .switch i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform var(--dur) var(--ease);}
  .switch.on i{transform:translateX(20px);}
  .set-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);}
  .set-row:last-child{border-bottom:none;}
  .set-row .sr-body{flex:1;}
  .set-row .sr-t{font-size:15px;font-weight:700;}
  .set-row .sr-d{font-size:12.5px;color:var(--muted);margin-top:3px;}
  .outline-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;height:52px;border-radius:14px;background:transparent;border:1.5px dashed var(--gray-seg);font-size:14.5px;font-weight:700;margin-top:14px;}
  .danger-outline{width:100%;height:52px;border-radius:14px;background:transparent;border:1.5px solid var(--danger-tint);color:var(--danger-text);font-size:15px;font-weight:700;}
  .spinner{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;display:inline-block;}

  /* camera */
  .camera{background:#0E1116;color:#fff;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}
  .camera .appbar{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;}
  .camera .icon-btn.ghost{color:#fff;}
  .viewfinder{position:relative;margin:4px 20px;flex:1;min-height:400px;border-radius:24px;overflow:hidden;background:radial-gradient(circle at 50% 40%, #2A3139, #0E1116 75%);display:flex;align-items:center;justify-content:center;}
  .vf-corner{position:absolute;width:34px;height:34px;border:3px solid #fff;opacity:.9;}
  .vf-corner.tl{top:24px;left:24px;border-right:0;border-bottom:0;border-radius:10px 0 0 0;}
  .vf-corner.tr{top:24px;right:24px;border-left:0;border-bottom:0;border-radius:0 10px 0 0;}
  .vf-corner.bl{bottom:24px;left:24px;border-right:0;border-top:0;border-radius:0 0 0 10px;}
  .vf-corner.br{bottom:24px;right:24px;border-left:0;border-top:0;border-radius:0 0 10px 0;}
  .vf-hint{position:absolute;bottom:40px;left:0;right:0;text-align:center;font-size:13px;color:rgba(255,255,255,.8);}
  .paper{background:#FFFFFF;color:#222;width:200px;padding:16px 16px 20px;border-radius:6px;box-shadow:0 12px 34px rgba(0,0,0,.45);font-size:11.5px;font-family:ui-monospace, Menlo, Consolas, monospace;transform:rotate(-2deg);}
  .paper .p-store{font-weight:800;font-size:13px;text-align:center;font-family:inherit;}
  .paper .p-sep{border-top:1px dashed #999;margin:8px 0;}
  .paper .p-row{display:flex;justify-content:space-between;margin:3px 0;}
  .paper .p-total{font-weight:800;font-size:13px;}
  .scan-wrap{position:relative;}
  .scan-line{position:absolute;left:-8px;right:-8px;height:3px;background:#6DBE6D;box-shadow:0 0 18px #6DBE6D;border-radius:2px;animation:scan 1.1s ease-in-out infinite alternate;}
  .scan-img{max-width:220px;max-height:320px;border-radius:8px;display:block;box-shadow:0 12px 34px rgba(0,0,0,.45);}
  .cam-controls{display:flex;align-items:center;justify-content:space-around;padding:22px 20px calc(30px + env(safe-area-inset-bottom));}
  .cam-side{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;color:#fff;font-size:12px;font-weight:600;width:72px;cursor:pointer;}
  .cam-side .cs-ic{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;}
  .shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:transparent;padding:5px;}
  .shutter span{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:transform var(--dur-fast);}
  .shutter:active span{transform:scale(.88);}
  .scan-status{text-align:center;padding:26px 20px 40px;}
  .scan-status p{margin:0;}
  .scan-steps{display:flex;flex-direction:column;gap:8px;margin-top:16px;align-items:center;font-size:13px;color:rgba(255,255,255,.55);}
  .scan-steps .done{color:#fff;}
  .recog{background:var(--card);border-radius:16px;padding:16px 18px;margin-top:18px;}
  .recog-head{display:flex;align-items:center;gap:12px;}
  .recog-thumb{width:52px;height:52px;border-radius:10px;background:var(--warn-bg);color:var(--warn-text);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
  .recog-thumb img{width:100%;height:100%;object-fit:cover;}
  .recog-rows{margin-top:12px;border-top:1px solid var(--border);padding-top:10px;font-size:13.5px;}
  .recog-rows div{display:flex;justify-content:space-between;padding:4px 0;}
  .recog-rows .tot{font-weight:800;border-top:1px dashed var(--border);margin-top:6px;padding-top:10px;}
  .ok-tag{font-size:11px;font-weight:800;color:var(--primary-text);background:var(--primary-tint);padding:3px 8px;border-radius:8px;}

  /* guide */
  .seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--gray);border-radius:14px;padding:4px;margin:6px 16px 4px;}
  .seg-ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / 3);background:var(--card);border-radius:10px;box-shadow:var(--shadow);transition:transform var(--dur) var(--ease);}
  .seg button{position:relative;z-index:1;height:40px;border:none;background:none;font-size:13.5px;font-weight:700;color:var(--muted);}
  .seg button.on{color:var(--text);}
  .g-step{display:flex;gap:14px;padding:12px 0;}
  .g-num{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;}
  .g-t{font-weight:800;font-size:15px;margin:0 0 4px;}
  .g-d{font-size:13.5px;color:var(--muted);line-height:1.55;margin:0;}
  .q-list{counter-reset:q;}
  .q-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
  .q-item:last-child{border-bottom:none;}
  .q-ic{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:800;font-size:14px;}
  .ex{border-radius:14px;padding:14px;margin-top:10px;font-size:13.5px;line-height:1.55;}
  .ex.good{background:var(--primary-tint);}
  .ex.bad{background:var(--danger-tint);}
  .ex-tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;margin-bottom:6px;color:#fff;}
  .ex.good .ex-tag{background:var(--primary);}
  .ex.bad .ex-tag{background:var(--danger);}
  .tip{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);color:var(--warn-text);border-radius:14px;padding:14px;font-size:13.5px;font-weight:600;line-height:1.55;}

  /* ai */
  .ai-hero .week-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--primary-text);background:var(--primary-tint);padding:4px 10px;border-radius:10px;}
  .week-bars{display:flex;align-items:flex-end;gap:8px;height:96px;margin-top:18px;}
  .wbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;}
  .wbar i{display:block;width:100%;max-width:24px;border-radius:8px 8px 3px 3px;background:var(--primary-tint2);transform-origin:bottom;animation:growY var(--dur-slow) var(--ease) both;}
  .wbar.max i{background:var(--primary);}
  .wbar small{font-size:11px;color:var(--muted);font-weight:700;}
  .cmp-row{display:flex;gap:10px;margin-top:16px;}
  .cmp{flex:1;border-radius:14px;padding:12px;}
  .cmp .c-l{font-size:12px;color:var(--muted);font-weight:700;}
  .cmp .c-v{font-size:19px;font-weight:800;margin-top:2px;}
  .cmp .c-d{font-size:11.5px;font-weight:700;margin-top:2px;}
  .sol{display:flex;gap:12px;background:var(--card);border-radius:16px;margin:0 16px 10px;padding:16px;box-shadow:var(--shadow);}
  .sol-num{width:28px;height:28px;border-radius:50%;background:var(--primary-tint);color:var(--primary-text);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;}
  .sol-t{font-size:15px;font-weight:800;margin:2px 0 3px;}
  .sol-o{font-size:12.5px;color:var(--muted);margin:0;}
  .sol-tip{font-size:14px;line-height:1.55;margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--gray);}
  .sol-act{background:none;border:none;color:var(--primary-text);font-size:13px;font-weight:700;padding:10px 0 0;}
  .section-label{font-size:14px;font-weight:800;color:var(--muted);padding:18px 20px 10px;}
  .challenge{background:var(--primary-tint);border-radius:16px;margin:4px 16px 0;padding:18px;}
  .challenge .ch-t{font-size:12.5px;font-weight:800;color:var(--primary-text);display:flex;align-items:center;gap:6px;}
  .challenge .ch-v{font-size:17px;font-weight:800;margin:6px 0 0;}
  .challenge .primary-btn{margin-top:14px;padding:14px;}
  .challenge .primary-btn.accepted{background:var(--card);color:var(--primary-text);}
  .skel{border-radius:10px;background:linear-gradient(90deg, var(--gray) 25%, color-mix(in srgb, var(--gray) 45%, var(--card)) 50%, var(--gray) 75%);background-size:200% 100%;animation:shimmer 1.3s linear infinite;}
  .ai-steps{display:flex;flex-direction:column;gap:12px;margin-top:18px;}
  .ai-step{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--muted);transition:color var(--dur);}
  .ai-step.done{color:var(--text);}
  .ai-step .st-ic{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--gray);color:#fff;transition:background-color var(--dur);}
  .ai-step.done .st-ic{background:var(--primary);}
  .ai-step.active .st-ic{background:transparent;color:var(--primary-text);}
  .disclaimer{font-size:12px;color:var(--muted);text-align:center;margin:16px 20px 0;line-height:1.6;}

  /* login */
  .hdr-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:16px 20px calc(32px + env(safe-area-inset-bottom));}
  .login-top{display:flex;justify-content:flex-end;}
  .login-brand{text-align:center;margin:44px 0 28px;}
  .login-mark{width:84px;height:84px;border-radius:50%;background:var(--avatar-bg);display:flex;align-items:center;justify-content:center;font-size:42px;margin:0 auto 16px;}
  .login-name{font-size:26px;font-weight:800;margin:0 0 6px;}
  .login-card{background:var(--card);border-radius:20px;padding:22px 18px;box-shadow:var(--shadow);}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .role{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px 14px;border-radius:16px;border:1.5px solid var(--border);background:var(--card);text-align:left;}
  .role.on{border-color:var(--primary);background:var(--primary-tint);}
  .role-ic{width:38px;height:38px;border-radius:12px;background:var(--gray);color:var(--muted);display:flex;align-items:center;justify-content:center;margin-bottom:6px;transition:background-color var(--dur-fast), color var(--dur-fast);}
  .role.on .role-ic{background:var(--primary);color:#fff;}
  .role-l{font-size:15.5px;font-weight:800;}
  .role-d{font-size:12px;color:var(--muted);font-weight:600;}
  .pw-input{letter-spacing:6px;font-size:20px;}
  .pw-input::placeholder{letter-spacing:0;font-size:15px;}
  .pw-input.err{border-color:var(--danger);}
  .shake{animation:shake .45s ease both;}

  /* teacher */
  .t-lead{font-size:13.5px;color:var(--muted);line-height:1.55;margin:12px 0 4px;}
  .t-dist{padding:12px 0;border-bottom:1px solid var(--border);}
  .t-dist-t{font-size:14px;font-weight:800;}
  .t-legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:12px;}
  .t-legend span{display:flex;align-items:center;gap:5px;}
  .t-legend i{width:9px;height:9px;border-radius:3px;display:inline-block;}
  .t-change{display:flex;align-items:center;justify-content:space-around;gap:10px;margin:14px 0 8px;text-align:center;}
  .t-change div{display:flex;flex-direction:column;gap:4px;}
  .t-change b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;}
  .t-arrow{color:var(--muted);display:flex;}
  .t-filter{margin:6px 16px 10px;}
  .t-list{display:flex;flex-direction:column;gap:10px;margin:0 16px;}
  .t-row{width:100%;text-align:left;border:none;background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);}
  .t-row-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;}
  .t-id{font-size:15.5px;font-weight:800;display:flex;align-items:center;gap:6px;}
  .live-tag{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:8px;background:var(--blue-tint);color:var(--auto-text);}
  .t-grades{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  .t-grades div{display:flex;flex-direction:column;align-items:flex-start;gap:5px;}
  .t-g-l{font-size:11px;color:var(--muted);font-weight:700;}
  .gp{display:inline-block;font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:10px;white-space:nowrap;}
  .gp.g0{background:var(--primary);color:#fff;}
  .gp.g1{background:var(--lime);color:var(--lime-ink);}
  .gp.g2{background:var(--blue-tint);color:var(--blue-text);}
  .gp.g3{background:var(--warn-bg);color:var(--warn-text);}
  .gp.g4{background:var(--danger-tint);color:var(--danger-text);}
  .t-metric{font-size:20px;font-weight:800;margin:14px 0 2px;font-variant-numeric:tabular-nums;}
  .t-weeks{display:flex;align-items:flex-end;gap:10px;height:96px;margin-top:14px;}
  .tw{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;}
  .tw i{display:block;width:100%;max-width:36px;border-radius:8px 8px 3px 3px;background:var(--primary-tint2);transform-origin:bottom;animation:growY var(--dur-slow) var(--ease) both;}
  .tw:last-child i{background:var(--primary);}
  .tw-v{font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums;}
  .tw-l{font-size:11px;color:var(--muted);font-weight:700;}
  .t-scale{display:flex;flex-direction:column;gap:6px;margin-top:16px;}
  .t-level{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:12px;border:1.5px solid transparent;font-size:12.5px;color:var(--muted);}
  .t-level.on{color:var(--text);border-color:var(--border);background:var(--gray);}
  .t-level.on.g0,.t-level.on.g1{border-color:var(--primary);background:var(--primary-tint);}
  .t-lv-n{width:58px;flex-shrink:0;font-weight:800;}
  .t-lv-t{line-height:1.45;}
  .t-dates{padding:12px 0 2px;}
  .t-date-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .t-date-chips span{font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:8px;background:var(--gray);color:var(--muted);font-variant-numeric:tabular-nums;}
  .t-pp{margin-top:14px;}
  .t-pp b{font-size:13.5px;}
  .t-verdict{font-size:13.5px;font-weight:800;margin:12px 0 0;}
  /* growth report */
  .gr-hero .week-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--primary-text);background:var(--primary-tint);padding:4px 10px;border-radius:10px;}
  .gr-score{display:flex;align-items:baseline;gap:6px;margin:14px 0 2px;}
  .gr-num{font-size:44px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;}
  .gr-unit{font-size:15px;font-weight:700;color:var(--muted);}

  @keyframes toastIn{from{opacity:0;transform:translate(-50%,12px);}to{opacity:1;transform:translate(-50%,0);}}

  @property --gsweep{syntax:'<angle>';inherits:false;initial-value:180deg;}

  @keyframes gsweepIn{from{--gsweep:0deg;}to{--gsweep:180deg;}}
  .donut{-webkit-mask:conic-gradient(#000 var(--sweep), transparent 0);mask:conic-gradient(#000 var(--sweep), transparent 0);animation:sweepIn .9s var(--ease) both;}

  .calm .bar,.calm .donut,.calm .gauge-circle,.calm .score-fill,.calm .wbar i,.calm .tw i,.calm .pop-in,.calm .result-avatar{animation:none !important;}

Object.keys(PERSONAS).forEach(k=>{ PERSONAS[k].key=k; });
function pImg(p, size){ return '<img class="p-img" src="'+PERSONA_IMG[p.key]+'" alt="'+p.name+'" width="'+size+'" height="'+size+'" draggable="false">'; }
const PERSONA_ORDER = ['aura','joy','hyunjae','melon','jay'];

/* ---------------- HELPERS ---------------- */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(n){ return Math.abs(n).toLocaleString('ko-KR')+'원'; }
function signed(n){ return n.toLocaleString('ko-KR')+'원'; }
function isDark(){
  const t = document.documentElement.getAttribute('data-theme');
  if(t) return t==='dark';
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function bankLabel(n){ return /뱅크|금고|우체국|은행$|카드|머니/.test(n) ? n : n+'은행'; }
function todaysTxns(){ return state.transactions.filter(t=>t.dateKey===TODAY_KEY); }
function sortTxns(){ state.transactions.sort((a,b)=> a.dateKey===b.dateKey ? 0 : (a.dateKey < b.dateKey ? 1 : -1)); }
function groupByDate(){
  const map = {}; const order = [];
  state.transactions.forEach(t=>{ if(!map[t.dateKey]){ map[t.dateKey]=[]; order.push(t.dateKey); } map[t.dateKey].push(t); });
  return order.map(k=>({key:k,label:DATE_LABELS[k]||k,items:map[k]}));
}
function catTotals(list){
  list = list || state.transactions;
  const totals = {}; CAT_ORDER.forEach(c=>totals[c]=0);
  list.forEach(t=>{ if(totals[t.cat]!==undefined) totals[t.cat]+=Math.abs(t.amount); });
  return totals;
}
function classifyTotals(list){
  list = list || state.transactions;
  let need=0, impulse=0, none=0;
  list.forEach(t=>{ const a=Math.abs(t.amount); if(t.cls==='need') need+=a; else if(t.cls==='impulse') impulse+=a; else none+=a; });
  return {need, impulse, none};
}
function totalSpend(list){ return (list||state.transactions).reduce((s,t)=>s+Math.abs(t.amount),0); }
function conicGradient(entries, span, from){
  span = span || 360;
  const total = entries.reduce((s,e)=>s+e.value,0) || 1;
  let acc = 0; const stops=[];
  entries.forEach(e=>{
    if(e.value<=0) return;
    const start = acc/total*span; acc += e.value; const end = acc/total*span;
    stops.push(e.color+' '+start.toFixed(2)+'deg '+(end-0.8).toFixed(2)+'deg', 'var(--card) '+(end-0.8).toFixed(2)+'deg '+end.toFixed(2)+'deg');
  });
  if(span<360) stops.push('transparent '+span+'deg 360deg');
  return 'conic-gradient(from '+(from||0)+'deg, '+stops.join(',')+')';
}
function dataSig(){ return state.transactions.map(t=>t.id+':'+t.cat+':'+t.cls).join('|'); }
function newForm(extra){ return Object.assign({name:'', amount:'', cat:'food', sub:null, beforeOpen:false, checks:[false,false,false,false], memo:'', suggested:null}, extra||{}); }

/* ---------------- AI REPORT ---------------- */
function buildReport(){
  const list = state.transactions;
  const total = totalSpend(list);
  const byCat = catTotals(list);
  const top = CAT_ORDER.reduce((a,b)=> byCat[a]>=byCat[b]?a:b);
  const cls = classifyTotals(list);
  const impulsePct = total ? Math.round(cls.impulse/total*100) : 0;
  const needPct = total ? Math.round(cls.need/total*100) : 0;
  const days = WEEK.map(w=>({d:w.d, v:list.filter(t=>t.dateKey===w.key).reduce((s,t)=>s+Math.abs(t.amount),0)}));
  const maxDay = days.reduce((a,b)=> a.v>=b.v?a:b);
  const unsorted = list.filter(t=>!t.cls || t.cat==='unset').length;
  const catAdvice = {
    cafe:'음료는 일주일에 두 번만 사기로 정해 보세요. 물병을 챙기면 훨씬 쉬워요.',
    snack:'간식을 사기 전에 이번 주 간식비가 얼마 남았는지 먼저 확인해 보세요.',
    game:'게임 결제는 한 달 예산을 먼저 정하고, 결제하기 전에 하루만 기다려 보세요.',
    shopping:'사고 싶은 물건은 장바구니에 담아 두고 다음 날 다시 확인해 보세요.',
    beauty:'꾸미기 소비는 한 달에 쓸 금액을 정해 두면 고민이 줄어요.',
    food:'식비는 꼭 필요한 소비예요. 간식·음료와 겹치지 않는지만 살펴봐요.',
    transport:'교통비는 필요한 소비예요. 가까운 거리는 걸어 보는 것도 좋아요.'
  };
  const sols = [];
  sols.push({title:CATS[top].full+'에 가장 많이 썼어요', obs:fmt(byCat[top])+' · 이번 주 지출의 '+Math.round(byCat[top]/(total||1)*100)+'%', tip:catAdvice[top]});
  const diff = impulsePct - LAST_WEEK.impulse;
  if(impulsePct >= 25){
    sols.push({title:'충동 소비가 '+impulsePct+'%예요', obs:'지난주 '+LAST_WEEK.impulse+'%보다 '+Math.abs(diff)+'%p '+(diff<=0?'줄었어요':'늘었어요'),
      tip: state.diagnosis ? PERSONAS[state.diagnosis].aiTip : '사고 싶은 게 생기면 10분만 기다려 보세요. 그래도 필요하면 그때 사도 늦지 않아요.'});
  } else {
    sols.push({title:'충동 소비를 잘 참았어요', obs:'충동 소비 '+impulsePct+'% · 지난주 '+LAST_WEEK.impulse+'%', tip:'지금처럼 사기 전에 한 번 더 생각하는 습관을 이어가요.'});
  }
  if(unsorted>0){
    sols.push({title:'아직 정리하지 않은 소비가 '+unsorted+'건 있어요', obs:'지출 항목이나 필요·충동을 고르지 않았어요', tip:'돌아보기에서 정리하면 다음 주 분석이 더 정확해져요.', action:{label:'돌아보기로 가기 →', act:'go-reflect'}});
  } else {
    sols.push({title:maxDay.d+'요일에 가장 많이 썼어요', obs:fmt(maxDay.v)+' 지출', tip:'그날 어떤 상황이었는지 한 줄 일지에 남겨 보세요. 반복되는 패턴이 보여요.'});
  }
  const impulseByCat = {};
  list.filter(t=>t.cls==='impulse' && CATS[t.cat]).forEach(t=>{ impulseByCat[t.cat]=(impulseByCat[t.cat]||0)+Math.abs(t.amount); });
  const chCat = Object.keys(impulseByCat).sort((a,b)=>impulseByCat[b]-impulseByCat[a])[0] || top;
  const base = impulseByCat[chCat] || byCat[chCat] || 5000;
  const budget = Math.max(1000, Math.floor(base*0.7/1000)*1000);
  const delta = total - LAST_WEEK.total;
  return {
    total, needPct, impulsePct, days, maxDay,
    headline:'이번 주 '+fmt(total)+'을 썼어요',
    delta:'지난주보다 '+fmt(Math.abs(delta))+' '+(delta>=0?'더':'덜')+' 썼어요',
    deltaUp: delta>=0,
    solutions:sols,
    challenge:'다음 주 '+CATS[chCat].full+' '+fmt(budget)+' 이하로 쓰기'
  };
}

/* ---------------- STAGE ---------------- */
function stageDone(s){ return s.missions.every(m=>m.done); }
function currentStageIdx(){ const i = STAGES.findIndex(s=>!stageDone(s)); return i<0 ? STAGES.length-1 : i; }
function completeMission(key){
  const cs = currentStageIdx();
  const m = STAGES[cs].missions.find(x=>x.key===key && !x.done);
  if(!m) return null;
  m.done = true;
  if(stageDone(STAGES[cs]) && cs < STAGES.length-1) return '챌린지 '+(cs+1)+' 완료! 다음 챌린지가 열렸어요';
  return '미션 완료 · '+m.text;
}
function renderStage(){
  const idx = state.stageView;
  const cs = currentStageIdx();
  const stage = STAGES[idx];
  const locked = idx > cs;
  const cleared = stageDone(stage);
  const done = stage.missions.filter(m=>m.done).length;
  const pct = Math.round(done/stage.missions.length*100);
  const dirCls = state.stageDir==='prev' ? 'from-left' : 'from-right';
  const badge = locked ? '<span class="stage-badge lock">'+icon('lock',13)+'잠김</span>'
    : (cleared ? '<span class="stage-badge clear">'+icon('check',13)+'완료</span>' : '<span class="stage-badge now">진행 중</span>');
  const sub = locked ? '이전 챌린지를 모두 완료하면 열려요'
    : (cleared ? '이 챌린지의 미션을 모두 완료했어요' : '미션을 완료해 다음 챌린지로 올라가요');
  return header('챌린지')+
  '<div class="card" style="overflow:hidden"><div class="stage-carousel" data-swipe="stage">'+
    '<button class="car-arrow left" data-action="stage-prev" aria-label="이전 챌린지" '+(idx===0?'disabled':'')+'>'+icon('chevron-left',18)+'</button>'+
    '<button class="car-arrow right" data-action="stage-next" aria-label="다음 챌린지" '+(idx===STAGES.length-1?'disabled':'')+'>'+icon('chevron-right',18)+'</button>'+
    '<div class="'+dirCls+(locked?' stage-locked':'')+'" data-key="s'+idx+'"><div class="stage-emoji">'+stage.emoji+'</div><p class="stage-title">'+stage.title+'</p>'+badge+'<p class="stage-desc">'+stage.desc+'</p></div>'+
    '<div class="dots">'+STAGES.map((s,i)=>'<span class="'+(i===idx?'active':'')+(i<cs?' cleared':'')+'"></span>').join('')+'</div>'+
  '</div></div>'+
  '<div class="card"><div class="card-row"><p class="sec-title">이번 챌린지 진행률</p><span style="color:'+(locked?'var(--muted)':'var(--primary-text)')+';font-weight:800">'+(locked?'잠김':pct+'%')+'</span></div>'+
    '<div class="progress-track" style="margin-top:10px"><div class="progress-fill" style="width:'+(locked?0:pct)+'%"></div></div>'+
    '<p class="stage-sub" style="margin-top:8px">'+sub+'</p></div>'+
  '<div class="card"><p class="sec-title" style="margin-bottom:6px">개인 미션</p>'+
    '<div class="'+dirCls+(locked?' missions-locked':'')+'" data-key="m'+idx+'">'+stage.missions.map(m=>{
      if(locked) return '<div class="mission-row"><div class="mission-check lock">'+icon('lock',13)+'</div><div class="mission-text">'+m.text+'</div><span class="mission-tag lock">잠김</span></div>';
      return '<div class="mission-row"><div class="mission-check '+(m.done?'done':'todo')+'">'+(m.done?icon('check',15):'')+'</div><div class="mission-text '+(m.done?'done':'')+'">'+m.text+'</div>'+(m.done?'':'<span class="mission-tag">진행 중</span>')+'</div>';
    }).join('')+'</div>'+
  '</div>'+
  growthCard();
}
function growthCard(){
  const weeks = allWeeks();
  const cur = weeks[weeks.length-1], d = cur.index - weeks[weeks.length-2].index;
  return '<button class="card card-btn" data-action="open-growth">'+
    '<span class="ai-badge" style="width:44px;height:44px">'+icon('trend',20)+'</span>'+
    '<div class="type-info"><p class="k1">나의 성장 리포트</p><p class="k2" style="font-size:15.5px">직조 지수 '+cur.index+'점 · 지난주보다 '+(d>=0?'+':'−')+Math.abs(d)+'</p></div>'+
    '<span class="chevron">'+icon('chevron-right',20)+'</span></button>';
}

function computeQuizResult(){
  const sums = {}; PERSONA_ORDER.forEach(k=>sums[k]=0);
  QUIZ.forEach((q,i)=>{ sums[q.grp] += (state.quizAnswers[i]||0); });
  let best = PERSONA_ORDER[0];
  PERSONA_ORDER.forEach(k=>{ if(sums[k] > sums[best]) best = k; });
  return {sums, best};
}

function rubricLevel(text){
  const t = (text||'').replace(/\s+/g,' ').trim();
  if(!t) return null;
  if(/다음엔|다음에|앞으로|해야지|하겠|할 거|줄여|줄이|챙겨|확인해야|기다려/.test(t)) return 3;
  if(/왜|때문|따라|사실|필요 없|필요했|필요한|충동|원래|싸서|할인|준비물|이라서|이라 /.test(t)) return 2;
  if(/맛있|좋았|기뻤|행복|아쉽|아쉬|후회|속상|뿌듯|만족|기분|잘했/.test(t)) return 1;
  return 0;
}
function plannedAs(t){ return t.before ? (t.before.checks[0] ? 'need' : 'impulse') : null; }
function currentMetrics(){
  const list = state.transactions;
  const n = list.length || 1;
  const recDays = new Set(list.map(t=>t.dateKey));
  const refl = state.reflections;
  const doneDays = refl.filter(r=>recDays.has(r.dateKey)).length;
  const withBefore = list.filter(t=>t.before);
  const depth = withBefore.length ? withBefore.reduce((s,t)=>s+t.before.checks.filter(Boolean).length,0)/withBefore.length : 0;
  const memo = withBefore.length ? withBefore.filter(t=>t.before.memo).length/withBefore.length : 0;
  const diaries = refl.filter(r=>r.diary && r.diary.trim());
  const levels = diaries.map(r=>rubricLevel(r.diary));
  const planned = list.filter(t=>t.before && t.cls);
  const cls = classifyTotals(list);
  const total = totalSpend(list) || 1;
  return {
    label:'4주차', range:'7/13–7/19', live:true,
    rec: recDays.size/7,
    done: recDays.size ? doneDays/recDays.size : 0,
    org: 1 - list.filter(t=>!t.cls || t.cat==='unset').length/n,
    before: withBefore.length/n,
    depth, memo,
    diaryRate: refl.length ? diaries.length/refl.length : 0,
    rubric: levels.length ? levels.reduce((a,b)=>a+b,0)/levels.length : 0,
    levels,
    plan: planned.length ? planned.filter(t=>plannedAs(t)===t.cls).length/planned.length : 0,
    plannedCount: planned.length,
    impulse: cls.impulse/total,
    regret: refl.length ? refl.filter(r=>r.mood==='regret'||r.mood==='regretish').length/refl.length : 0,
    reflCount: refl.length, recCount: recDays.size, txnCount: list.length, beforeCount: withBefore.length

function areaScores(m){
  return {
    use: (m.rec + m.done + m.org)/3,
    before: m.before*0.6 + (m.depth/4)*0.4,
    after: m.diaryRate*0.5 + (m.rubric/3)*0.5,
    structure: m.plan*0.6 + (1-m.impulse)*0.4
  };
}
function partialIndex(m){ const a = areaScores(m); return (20*a.use + 25*a.before + 25*a.after + 20*a.structure)/90; }
function diagnosisGrowth(){
  if(!state.diagnosis) return null;
  const post = computeQuizResult().sums, pre = PRE_DIAGNOSIS.sums;
  return clampNum(0.5 + ((post.jay-pre.jay) - (post.hyunjae-pre.hyunjae))/20, 0, 1);
}
function clampNum(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function allWeeks(){
  const weeks = EXAMPLE_WEEKS.map(w=>Object.assign({}, w)).concat([currentMetrics()]);
  weeks.forEach((w,i)=>{
    const prev = i ? partialIndex(weeks[i-1]) : partialIndex(w);
    let change = clampNum(0.5 + (partialIndex(w)-prev)*2.5, 0, 1);
    if(w.live){ const d = diagnosisGrowth(); if(d!==null) change = (change + d)/2; }
    w.change = change;
    const a = areaScores(w);
    w.areas = {use:a.use, before:a.before, after:a.after, structure:a.structure, change:change};
    w.index = Math.round(20*a.use + 25*a.before + 25*a.after + 20*a.structure + 10*change);
  });
  return weeks;
}

function csvCell(v){
  if(v===null || v===undefined) return '';
  let s = String(v);
  if(typeof v==='string' && /^[=+\-@]/.test(s) && isNaN(Number(s))) s = "'"+s;
  return /[",\r\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function downloadCSV(name, rows){
  const csv = '﻿' + rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}

/* ---------------- MORPH (in-place DOM patch keeps transitions & focus) ---------------- */
function isKeyed(n){ return n.nodeType===1 && n.hasAttribute('data-key'); }
function morph(a, b){
  if(a.nodeType!==b.nodeType || a.nodeName!==b.nodeName || (a.nodeType===1 && a.getAttribute('data-key')!==b.getAttribute('data-key'))){ a.replaceWith(b); return; }
  if(a.nodeType!==1){ if(a.nodeValue!==b.nodeValue) a.nodeValue=b.nodeValue; return; }
  for(const at of Array.from(a.attributes)) if(!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  for(const at of Array.from(b.attributes)) if(a.getAttribute(at.name)!==at.value) a.setAttribute(at.name, at.value);
  if(a.nodeName==='INPUT' || a.nodeName==='TEXTAREA'){
    if(a.type==='file') return;
    const v = a.nodeName==='TEXTAREA' ? b.value : (b.getAttribute('value')||'');
    if(document.activeElement!==a && a.value!==v) a.value = v;
    if(a.nodeName==='TEXTAREA') return;
  }
  morphChildren(a, b);
}
function morphChildren(a, b){
  const oc = Array.from(a.childNodes), nc = Array.from(b.childNodes);
  if(!nc.some(isKeyed) && !oc.some(isKeyed)){
    for(let i=0;i<nc.length;i++){ if(i<oc.length) morph(oc[i], nc[i]); else a.appendChild(nc[i]); }
    for(let i=nc.length;i<oc.length;i++) oc[i].remove();
    return;
  }
  const map = new Map();
  oc.forEach(n=>{ if(isKeyed(n)) map.set(n.getAttribute('data-key'), n); else n.remove(); });
  let ref = a.firstChild;
  nc.forEach(n=>{
    const k = isKeyed(n) ? n.getAttribute('data-key') : null;
    const match = k ? map.get(k) : null;
    if(match){
      map.delete(k);
      if(match!==ref) a.insertBefore(match, ref); else ref = ref.nextSibling;
      morph(match, n);
    } else {
      a.insertBefore(n, ref);
    }
  });
  map.forEach(n=>n.remove());
}
function patch(el, html){ const tmp = el.cloneNode(false); tmp.innerHTML = html; morphChildren(el, tmp); }

function gradeByRate(p, cuts){ for(let i=0;i<cuts.length;i++) if(p>=cuts[i]) return i; return 4; }
function accessDates(days){
  const order = [0,2,4,1,3,5,6];
  const out = [];
  days.forEach((n,w)=>{ order.slice(0,n).sort((a,b)=>a-b).forEach(d=>out.push(PROGRAM_WEEKS[w].dates[d])); });
  return out;
}

  const cs = currentStageIdx();

  const dates = accessDates([4,5,6,recDays]);
  if(dates[dates.length-1]!=='7/19') dates.push('7/19');

    chal:[missions.filter(m=>m.done).length, missions.length],
    visits:17 + state.access.logins, minutes:196 + Math.round(liveMs/60000), dates
  };

function evaluate(s){
  const dates = s.dates || accessDates(s.days);
  const avgDays = s.days.reduce((a,b)=>a+b,0)/4;
  const txnTotal = s.txns.reduce((a,b)=>a+b,0);
  const clsTotal = s.cls.reduce((a,b)=>a+b,0);
  const clsRate = txnTotal ? clsTotal/txnTotal : 0;
  const chalRate = s.chal[1] ? s.chal[0]/s.chal[1] : 0;
  const imp = o => (o.need+o.impulse) ? o.impulse/(o.need+o.impulse) : null;
  return Object.assign({}, s, {
    dates, last:dates[dates.length-1] || '-',
    avgDays, txnTotal, clsTotal, clsRate, chalRate,
    earlyImp:imp(s.early), lateImp:imp(s.late),
    grades:{
      record: avgDays>=6 ? 0 : avgDays>=4 ? 1 : avgDays>=2 ? 2 : avgDays>=1 ? 3 : 4,
      reflect: gradeByRate(clsRate, [.8,.6,.4,.2]),
      challenge: gradeByRate(chalRate, [.9,.7,.5,.3])
    }
  });
}

/* ---------------- MASTER RENDER ---------------- */
let lastKey = null, navDir = null, focusSel = null;
const seenScreens = new Set();
const scrollMemo = {};
function screenKey(){
  if(!state.role) return 'login';
  if(state.role==='teacher') return 'teacher:'+(state.teacher.sel||'list');
  if(state.flow) return 'flow:'+state.flow.type+':'+(state.flow.step||'');
  if(state.diagView) return 'diag:'+state.diagView;
  return state.tab + (state.tab==='reflect' ? ':'+state.reflectView : '');
}
function screenHTML(){
  if(!state.role) return renderLogin();
  if(state.role==='teacher') return renderTeacher();
  const F = state.flow;
  if(F){
    if(F.type==='bank') return renderBankFlow(F.step);
    if(F.type==='manage') return renderManage();
    if(F.type==='receipt') return renderReceipt(F.step);
    if(F.type==='guide') return renderGuide();
    if(F.type==='ai') return renderAI();
    if(F.type==='growth') return renderGrowth();
  }
  if(state.diagView==='intro') return renderDiagnosisIntro();
  if(state.diagView==='quiz') return renderQuiz();
  if(state.diagView==='result') return renderDiagnosisResult();
  if(state.tab==='home') return renderHome();
  if(state.tab==='ledger') return renderLedger();
  if(state.tab==='reflect') return renderReflect();
  return renderStage();
}
let modalTimer = null, toastTimer = null;
function render(){
  const key = screenKey();
  const view = document.getElementById('view');
  const html = screenHTML();
  if(key!==lastKey){
    if(lastKey) scrollMemo[lastKey] = window.scrollY;
    view.innerHTML = html;
    view.classList.remove('screen-fade','screen-push','screen-pop');
    void view.offsetWidth;
    view.classList.add('screen-'+(navDir||'fade'));
    const sig = key+'|'+dataSig()+'|'+state.growthMetric;
    const calm = seenScreens.has(sig);
    seenScreens.add(sig);
    view.classList.toggle('calm', calm);
    if(!calm) runCounters(view);
    window.scrollTo(0, navDir==='pop' ? (scrollMemo[key]||0) : 0);
    lastKey = key;
  } else {
    patch(view, html);
  }
  navDir = null;
  document.getElementById('root').classList.toggle('no-nav', !!state.flow || state.role!=='learner');
  if(!(glassDrag && glassDrag.kind==='nav')) patch(document.getElementById('nav-root'), renderNav());
  patch(document.getElementById('fab-root'), renderFab());

  const mroot = document.getElementById('modal-root');
  const cur = mroot.firstElementChild;
  if(state.modal){
    clearTimeout(modalTimer);
    if(!cur || cur.classList.contains('closing')) mroot.innerHTML = modalHTML(); else patch(mroot, modalHTML());
    document.body.style.overflow = 'hidden';
  } else if(cur && !cur.classList.contains('closing')){
    cur.classList.add('closing');
    modalTimer = setTimeout(()=>{ mroot.innerHTML=''; }, 240);
    document.body.style.overflow = '';
  }
  state.modalDir = null;

  const troot = document.getElementById('toast-root');
  const tcur = troot.firstElementChild;
  if(state.toast){
    const th = '<div class="toast" role="status" data-key="'+state.toast.id+'">'+esc(state.toast.msg)+'</div>';
    if(!tcur || tcur.getAttribute('data-key')!==String(state.toast.id)) troot.innerHTML = th;
  } else if(tcur && !tcur.classList.contains('leaving')){
    tcur.classList.add('leaving');
    setTimeout(()=>{ if(!state.toast) troot.innerHTML=''; }, 220);
  }

  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', getComputedStyle(document.documentElement).getPropertyValue('--bg').trim());

  if(focusSel){ const el = document.querySelector(focusSel); if(el){ el.focus(); } focusSel = null; }
}
function showToast(msg){
  state.toast = {msg, id:Date.now()};
  render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ state.toast=null; render(); }, 1900);
}

/* ---------------- NAVIGATION HELPERS ---------------- */
function goTab(tab){
  state.tab = tab; state.reflectView='list'; state.diagView=null; state.flow=null; state.flowReturn=null;
  state.stageView = currentStageIdx();
  navDir = 'fade';
}
function startFlow(type, step){
  if(!state.flow) state.flowReturn = {tab:state.tab, reflectView:state.reflectView, diagView:state.diagView};
  state.flow = {type, step:step||''};
  state.modal = null;
  navDir = 'push';
}
function flowGo(step){ state.flow = Object.assign({}, state.flow, {step}); navDir = 'push'; }
function closeFlow(){
  state.flow = null;
  if(state.flowReturn){ state.tab=state.flowReturn.tab; state.reflectView=state.flowReturn.reflectView; state.diagView=state.flowReturn.diagView; }
  state.flowReturn = null;
  navDir = 'pop';
}
const BACK_MAP = {
  bank:{intro:null, consent:'intro', bank:'consent', account:'bank', verify:'account', done:null},
  receipt:{camera:null, scan:'camera', confirm:'camera'}
};
function flowBack(){
  const F = state.flow; if(!F) return;
  const map = BACK_MAP[F.type];
  const prev = map ? map[F.step] : null;
  if(F.type==='bank' && F.step==='bank' && state.bank.fromManage){ state.bank.fromManage=false; state.flow={type:'manage', step:''}; navDir='pop'; return; }
  if(prev){ state.flow = Object.assign({}, F, {step:prev}); navDir='pop'; }
  else closeFlow();
}

let verifyTimer = null;
function startVerifyTimer(){
  clearInterval(verifyTimer);
  state.verify.remaining = 300;

    if(!(state.flow && state.flow.type==='bank' && state.flow.step==='verify')){ clearInterval(verifyTimer); return; }
    if(state.verify.remaining>0){ state.verify.remaining--; render(); }
  }, 1000);
}
function importAutoTxns(){
  if(state.imported) return;
  const add = [
    {dateKey:'07-19', name:'온라인 쇼핑몰', cat:'unset', sub:'지출 항목 선택 필요', amount:-12900, meta:'오후 4:12 · 체크카드'},

    {dateKey:'07-18', name:'PC방', cat:'game', sub:'게임', amount:-3000, meta:'오후 5:40 · 체크카드'}
  ];
  add.forEach(a=>{ txnSeq++; state.transactions.unshift(Object.assign({id:txnSeq, cls:null, src:'auto'}, a)); });
  sortTxns();
  state.imported = true;

function addTxn(src){
  const f = state.form;
  txnSeq++;
  const t = {id:txnSeq, dateKey:TODAY_KEY, name:f.name.trim(), cat:f.cat, sub:f.sub && f.cat===f.suggested ? f.sub : CATS[f.cat].sub, amount:-Math.abs(Number(f.amount)), cls:null, src:src};
  if(f.checks.some(Boolean) || f.memo.trim()) t.before = {checks:f.checks.slice(), memo:f.memo.trim()};
  state.transactions.unshift(t);
  sortTxns();
  state.lastMethod = src==='receipt' ? 'receipt' : 'manual';
}
function runAI(){
  const A = state.ai;
  A.loading = true; A.step = 0; render();
  [600, 1200, 1800].forEach((ms,i)=>setTimeout(()=>{ A.step = i+1; render(); }, ms));
  setTimeout(()=>{
    A.report = buildReport(); A.sig = dataSig(); A.label = '방금 분석했어요'; A.loading = false; render();
  }, 2200);
}
function startReceiptScan(image){
  state.receipt.image = image || null;
  state.receipt.sample = (state.receipt.sample + (image?0:1)) % RECEIPTS.length;
  if(image) state.receipt.sample = Math.floor(Math.random()*RECEIPTS.length);
  state.receipt.scanStep = 0;
  flowGo('scan');
  render();
  [500, 1000, 1500].forEach((ms,i)=>setTimeout(()=>{ if(state.flow && state.flow.step==='scan'){ state.receipt.scanStep=i+1; render(); } }, ms));
  setTimeout(()=>{
    if(!(state.flow && state.flow.type==='receipt' && state.flow.step==='scan')) return;
    const R = RECEIPTS[state.receipt.sample];
    state.form = newForm({name:R.name, amount:String(R.items.reduce((s,i)=>s+i[1],0)), cat:R.cat, sub:R.sub, suggested:R.cat});
    flowGo('confirm'); render();
  }, 1900);
}

  'teacher-csv'(){ exportClassCSV(); setTimeout(()=>showToast('CSV 파일을 저장했어요'),0); },
  'open-growth'(){ startFlow('growth'); const m = completeMission('pattern'); if(m) setTimeout(()=>showToast(m),350); },
  'growth-metric'(el){ state.growthMetric = el.dataset.arg; },
  'csv'(el){ exportCSV(el.dataset.arg); setTimeout(()=>showToast('CSV 파일을 저장했어요'),0); },
  'go-diagnosis'(){ state.flow=null; state.flowReturn=null; state.tab='home'; state.quizAnswers={}; state.quizIndex=0; state.diagnosis=null; state.diagView='intro'; navDir='push'; },
  'stage-prev'(){ if(state.stageView>0){ state.stageView--; state.stageDir='prev'; } },
  'stage-next'(){ if(state.stageView<STAGES.length-1){ state.stageView++; state.stageDir='next'; } }
};

/* ---------------- LIQUID GLASS DRAG (nav pill & theme switch) ---------------- */
const DRAG_THRESHOLD = 3, ELASTIC = 8;
let glassDrag = null, suppressClick = false;
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
document.addEventListener('pointerdown', function(e){
  const el = e.target.closest('[data-drag]');
  if(!el || e.button>0) return;
  const kind = el.dataset.drag;
  const pill = el.querySelector('.lg-pill');
  const count = kind==='theme' ? 2 : 4;
  const step = kind==='theme' ? 36 : pill.getBoundingClientRect().width;
  const cur = kind==='theme' ? (isDark()?1:0) : Math.max(0, NAV_KEYS.indexOf(state.tab));
  if(e.pointerType==='mouse') e.preventDefault();
  glassDrag = {el, kind, pill, count, step, cur, id:e.pointerId, startX:e.clientX, startPill:cur*step, x:cur*step, moved:false};
  try{ el.setPointerCapture(e.pointerId); }catch(err){}
});
document.addEventListener('pointermove', function(e){
  const d = glassDrag;
  if(!d || e.pointerId!==d.id) return;
  const dx = e.clientX - d.startX;
  if(Math.abs(dx) > DRAG_THRESHOLD) d.moved = true;
  if(!d.moved) return;
  d.x = clamp(d.startPill + dx, -ELASTIC, (d.count-1)*d.step + ELASTIC);
  d.el.classList.add('dragging');
  d.pill.style.transition = 'transform 150ms cubic-bezier(0.34, 1.56, 0.64, 1)';
  d.pill.style.transform = 'translateX('+d.x+'px) scale(1.08)';
  const at = clamp(Math.round(d.x/d.step), 0, d.count-1);
  const light = d.el.querySelector('.lg-light');
  if(d.kind==='theme'){
    d.el.dataset.at = at;
    if(light) light.style.transform = 'rotate('+(at?15:-15)+'deg)';
  } else {
    d.el.querySelectorAll('.nav-item').forEach((b,i)=>b.classList.toggle('at', i===at));
    if(light) light.style.transform = 'rotate('+((at-1.5)*10)+'deg)';
  }
});
function endGlassDrag(e, cancelled){
  const d = glassDrag;
  if(!d || e.pointerId!==d.id) return;
  glassDrag = null;
  let idx = d.cur;
  if(!cancelled){
    if(d.moved) idx = clamp(Math.round(d.x/d.step), 0, d.count-1);
    else {
      const rect = d.el.getBoundingClientRect();
      const rel = e.clientX - rect.left;
      idx = d.kind==='theme' ? (rel > rect.width/2 ? 1 : 0) : clamp(Math.floor((rel-6)/d.step), 0, d.count-1);
    }
  }
  d.el.classList.remove('dragging');
  d.el.querySelectorAll('.nav-item.at').forEach(b=>b.classList.remove('at'));
  suppressClick = true;
  setTimeout(()=>{ suppressClick = false; }, 50);
  if(d.kind==='theme'){
    if(idx!==d.cur) setTheme(idx ? 'dark' : 'light');
  } else if(!cancelled){
    goTab(NAV_KEYS[idx]);
  }
  render();
}
document.addEventListener('pointerup', e=>endGlassDrag(e, false));
document.addEventListener('pointercancel', e=>endGlassDrag(e, true));
document.addEventListener('keydown', function(e){
  const sw = e.target.closest && e.target.closest('[data-drag="theme"]');
  if(sw && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); setTheme(isDark()?'light':'dark'); render(); document.querySelector('[data-drag="theme"]').focus(); }
});

/* ---------------- MOTION HELPERS ---------------- */
const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function runCounters(root){
  if(reduceMotion()) return;
  root.querySelectorAll('[data-count]').forEach(el=>{
    const t0 = performance.now(), d = 750;
    const step = now=>{
      if(!el.isConnected) return;
      const to = Number(el.dataset.count)||0, suf = el.dataset.suffix||'';
      const p = Math.min(1, (now-t0)/d), e = 1 - Math.pow(1-p, 3);
      el.textContent = Math.round(to*e).toLocaleString('ko-KR') + suf;
      if(p<1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

let sheetDrag = null;
document.addEventListener('pointerdown', function(e){
  const h = e.target.closest('[data-sheet-grab], .sheet-head');
  if(!h || e.button>0 || e.target.closest('button, input, textarea, label')) return;
  const sheet = h.closest('.sheet'); if(!sheet) return;
  sheetDrag = {sheet, id:e.pointerId, y0:e.clientY, t0:performance.now(), dy:0};
  sheet.style.animation = 'none'; sheet.style.transition = 'none';
  try{ h.setPointerCapture(e.pointerId); }catch(err){}
});
document.addEventListener('pointermove', function(e){
  const d = sheetDrag; if(!d || e.pointerId!==d.id) return;
  const raw = e.clientY - d.y0;
  d.dy = raw < 0 ? raw*0.15 : raw;
  d.sheet.style.transform = 'translateY('+d.dy+'px)';
});
function endSheetDrag(e){
  const d = sheetDrag; if(!d || e.pointerId!==d.id) return;
  sheetDrag = null;
  const v = d.dy / Math.max(1, performance.now()-d.t0);
  const sheet = d.sheet;
  if(d.dy > 120 || (v > 0.6 && d.dy > 40)){
    sheet.style.transition = 'transform var(--dur-fast) cubic-bezier(.4,0,1,1)';
    sheet.style.transform = 'translateY(100%)';
    const ov = sheet.closest('.overlay'); if(ov) ov.classList.add('closing');
    setTimeout(()=>{ state.modal = null; document.getElementById('modal-root').innerHTML=''; document.body.style.overflow=''; render(); }, 200);
  } else {
    sheet.style.transition = 'transform var(--dur) var(--spring)';
    sheet.style.transform = '';
    setTimeout(()=>{ sheet.style.transition=''; }, 340);
  }
}
document.addEventListener('pointerup', endSheetDrag);
document.addEventListener('pointercancel', endSheetDrag);

let swipe = null, suppressSwipeClick = false;
document.addEventListener('pointerdown', function(e){
  const el = e.target.closest('[data-swipe="stage"]');
  if(!el || e.button>0) return;
  swipe = {el, id:e.pointerId, x0:e.clientX, y0:e.clientY, dx:0, moved:false};
});
document.addEventListener('pointermove', function(e){
  const w = swipe; if(!w || e.pointerId!==w.id) return;
  const dx = e.clientX - w.x0, dy = e.clientY - w.y0;
  if(!w.moved){
    if(Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)){ swipe = null; return; }
    if(Math.abs(dx) > 8) w.moved = true; else return;
  }
  const atEdge = (dx>0 && state.stageView===0) || (dx<0 && state.stageView===STAGES.length-1);
  w.dx = atEdge ? dx*0.25 : dx;
  const inner = w.el.querySelector('[data-key^="s"]');
  if(inner){ inner.style.animation='none'; inner.style.transition='none'; inner.style.transform='translateX('+(w.dx*0.6)+'px)'; inner.style.opacity = String(1 - Math.min(.45, Math.abs(w.dx)/380)); }
});
function endSwipe(e){
  const w = swipe; if(!w || e.pointerId!==w.id) return;
  swipe = null;
  if(!w.moved) return;
  suppressSwipeClick = true; setTimeout(()=>{ suppressSwipeClick=false; }, 60);
  const go = w.dx < -60 ? 'stage-next' : (w.dx > 60 ? 'stage-prev' : null);
  const before = state.stageView;
  if(go) ACTIONS[go]();
  if(state.stageView !== before){ render(); return; }
  const inner = w.el.querySelector('[data-key^="s"]');
  if(inner){ inner.style.transition='transform var(--dur) var(--spring), opacity var(--dur-fast) var(--ease)'; inner.style.transform=''; inner.style.opacity=''; }
}
document.addEventListener('pointerup', endSwipe);
document.addEventListener('pointercancel', endSwipe);

/* ---------------- EVENTS ---------------- */
document.addEventListener('click', function(e){
  if(suppressSwipeClick && e.target.closest('[data-swipe]')) return;
  if(e.target.closest('[data-drag]') && (suppressClick || e.detail>0)) return;
  if(e.target.matches('[data-overlay], .sheet-wrap')){ state.modal=null; render(); return; }
  const nav = e.target.closest('[data-nav]');
  if(nav){ goTab(nav.dataset.nav); render(); return; }
  const act = e.target.closest('[data-action]');
  if(act){
    if(act.disabled) return;
    const fn = ACTIONS[act.dataset.action];
    if(fn){ const r = fn(act); if(r!=='rendered') render(); }
    return;
  }
  const catBtn = e.target.closest('[data-cat]');
  if(catBtn && state.form){ state.form.cat = catBtn.dataset.cat; render(); return; }
  const moodBtn = e.target.closest('[data-mood]');
  if(moodBtn){ state.mood = moodBtn.dataset.mood; render(); return; }
  const clsBtn = e.target.closest('[data-classify]');
  if(clsBtn){
    const t = state.transactions.find(x=>x.id===Number(clsBtn.dataset.classify));
    if(t) t.cls = clsBtn.dataset.val;
    render(); return;
  }
  const likert = e.target.closest('[data-answer]');
  if(likert){ state.quizAnswers[state.quizIndex] = Number(likert.dataset.answer); render(); return; }
});

function doLogin(){
  const L = state.login;
  if(L.pw.length!==4) return;
  if(L.pw!==PASSWORDS[L.role]){ L.error=true; L.attempt++; L.pw=''; focusSel='#login-pw'; render(); return; }
  state.role = L.role; L.pw=''; L.error=false;
  if(L.role==='learner'){ state.access.logins++; state.access.since=Date.now(); goTab('home'); }
  else { state.teacher.sel=null; navDir='fade'; }
  render();
  setTimeout(()=>showToast(L.role==='teacher'?'교수자로 로그인했어요':'학습자로 로그인했어요'), 0);
}
document.addEventListener('submit', function(e){
  if(e.target.matches('[data-form="login"]')){ e.preventDefault(); doLogin(); }
});
document.addEventListener('input', function(e){
  const el = e.target; const k = el.dataset && el.dataset.input;
  if(!k || k==='receipt-file') return;
  if(k==='name') state.form.name = el.value;
  else if(k==='amount') state.form.amount = el.value;
  else if(k==='memo') state.form.memo = el.value;
  else if(k==='diary') state.diaryText = el.value;
  else if(k==='bank-search') state.bank.search = el.value;
  else if(k==='acct'){ el.value = el.value.replace(/\D/g,'').slice(0,14); state.acct.number = el.value; }
  else if(k==='owner') state.acct.owner = el.value;
  else if(k==='student-id') state.studentId = el.value.slice(0,20);
  else if(k==='login-pw'){ el.value = el.value.replace(/\D/g,'').slice(0,4); state.login.pw = el.value; state.login.error = false; }
  else if(k==='teacher-memo') state.teacher.memo[state.teacher.sel] = el.value;
  else if(k==='digit'){
    const i = +el.dataset.i;
    const v = el.value.replace(/\D/g,'').slice(-1);
    el.value = v; state.verify.digits[i] = v; state.verify.error = false;
    if(v && i<3) focusSel = '[data-input="digit"][data-i="'+(i+1)+'"]';
  }
  render();
});
document.addEventListener('keydown', function(e){
  const el = e.target;
  if(el.dataset && el.dataset.input==='digit' && e.key==='Backspace' && !el.value){
    const i = +el.dataset.i;
    if(i>0){ const prev = document.querySelector('[data-input="digit"][data-i="'+(i-1)+'"]'); if(prev){ prev.focus(); } }
  }
  if(e.key==='Escape' && state.modal){ state.modal=null; render(); }
});
document.addEventListener('change', function(e){
  const el = e.target;
  if(el.dataset && el.dataset.input==='receipt-file' && el.files && el.files[0]){
    const reader = new FileReader();
    reader.onload = ()=> startReceiptScan(reader.result);
    reader.readAsDataURL(el.files[0]);
  }
});
if(window.matchMedia){
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const onChange = ()=>{ if(!document.documentElement.getAttribute('data-theme')) render(); };
  if(mq.addEventListener) mq.addEventListener('change', onChange); else if(mq.addListener) mq.addListener(onChange);
}

render();
</script>
